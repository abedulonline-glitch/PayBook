<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PayBook Pro | Axis Premium Edition</title>
    
    <!-- লাইব্রেরি এবং ডিপেন্ডেন্সি সমূহ (Point 13: Firebase Config) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* এক্সিস ব্যাংক প্রিমিয়াম থিম (Point 7) */
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;600;700;900&display=swap');
        :root { --axis-burgundy: #861F41; --axis-grey: #F4F7F9; }
        body { font-family: 'Public Sans', sans-serif; background-color: var(--axis-grey); color: #333; margin: 0; overflow: hidden; user-select: none; }
        .axis-gradient { background: linear-gradient(135deg, #861F41 0%, #631430 100%); }
        .axis-input { @apply w-full p-4 rounded-xl border border-slate-200 outline-none focus:border-[#861F41] bg-white text-slate-700; }
        
        /* ট্রানজ্যাকশন বাবল (পয়েন্ট ৫: Given/Received চেনা যাবে) */
        .bubble { max-width: 85%; padding: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); background: white; border-radius: 1.2rem; border: 1px solid #eee; }
        .bubble-left { align-self: flex-start; border-left: 5px solid #861F41; border-top-left-radius: 0; }
        .bubble-right { align-self: flex-end; border-right: 5px solid #10b981; border-top-right-radius: 0; }

        /* পিন ইনপুট (পয়েন্ট ৮: ছোট এবং স্মার্ট) */
        .pin-box { height: 50px !important; font-size: 1.5rem !important; letter-spacing: 0.8rem !important; }

        #entryDrawer { transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; }
        #entryDrawer.open { transform: translateY(0); }
        .hidden { display: none !important; }
        #mainViewport { height: calc(100vh - 65px); overflow-y: auto; scroll-behavior: smooth; }
        
        /* সিক্রেট ব্লিনকিং (পয়েন্ট ৪) */
        .blink-secret { animation: blinker 1s linear infinite; color: #ff4d4d !important; font-weight: 900; }
        @keyframes blinker { 50% { opacity: 0.2; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
   
        .tx-deleted { 
        opacity: 0.3 !important; /* হালকা ধূসর দেখাবে */
        filter: grayscale(1); /* রঙ চলে যাবে */
        text-decoration: line-through; /* মাঝখানে কাটা দাগ পড়বে */
        pointer-events: none; /* আর কোনো ক্লিক কাজ করবে না */
}
        /* বাটন হাইড করার এনিমেশন */
#ledgerFooter {
    transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

.footer-hidden {
    transform: translateY(120%); /* এটি বাটনকে স্ক্রিনের নিচে ঠেলে দিবে */
}
       /* হেডার এনিমেশন */
header {
    transition: transform 0.3s ease-in-out;
}
.header-hidden {
    transform: translateY(-100%);
}

/* ট্যাব বার ফিক্স: এটিও হেডারের সাথে মুভ করবে */
#tab-sticky-box {
    transition: top 0.3s ease-in-out, box-shadow 0.3s;
    background-color: white; /* ব্যাকগ্রাউন্ড সাদা থাকা জরুরি */
}

/* যখন হেডার লুকিয়ে যাবে, তখন ট্যাবটি একদম উপরে (top-0) চলে আসবে */
.tabs-at-top {
    top: 0px !important;
    box-shadow: 0 4px 10px rgba(0,0,0,0.05); /* উপরে গেলে হালকা শ্যাডো আসবে */
} 
    </style>
</head>
<body>

    <!-- ১. অথেনটিকেশন স্ক্রিন (Point 1a, 8, 12, 14) -->
    <div id="authScreen" class="fixed inset-0 z-[5000] bg-white flex flex-col items-center justify-center p-8 overflow-y-auto">
        <div class="w-full max-w-md text-center bg-white p-8 rounded-[3rem] shadow-xl border">
            <div class="w-20 h-20 axis-gradient rounded-3xl mx-auto mb-4 flex items-center justify-center text-white text-3xl font-black shadow-xl">PB</div>
            <h1 class="text-3xl font-black text-[#861F41] mb-6 tracking-tighter">PayBookPro</h1>
            
            <div class="flex bg-slate-100 p-1.5 rounded-2xl mb-8">
                <button onclick="toggleAuth('LOGIN')" id="tabLogin" class="flex-1 py-3 rounded-xl text-xs font-black bg-[#861F41] text-white shadow-md transition-all">LOGIN</button>
                <button onclick="toggleAuth('REG')" id="tabReg" class="flex-1 py-3 rounded-xl text-xs font-black text-slate-400">REGISTER</button>
            </div>

            <div id="loginBox" class="space-y-4">
                <input type="number" id="loginPhone" placeholder="Mobile Number" class="axis-input">
                <input type="password" id="loginPin" placeholder="PIN" maxlength="4" class="axis-input text-center pin-box shadow-inner">
                <button onclick="handleLogin()" class="w-full py-4 bg-[#861F41] text-white rounded-xl font-bold mt-4 shadow-lg uppercase tracking-widest active:scale-95">Unlock Account</button>
            </div>

            <div id="regBox" class="hidden space-y-4 text-left">
                <input type="text" id="regName" placeholder="Owner Name" class="axis-input">
                <input type="number" id="regPhone" placeholder="10-Digit Mobile" class="axis-input">
                <input type="password" id="regPin" placeholder="Set 4-Digit PIN" maxlength="4" class="axis-input text-center pin-box">
                <button onclick="handleRegistration()" class="w-full py-4 axis-gradient text-white rounded-xl font-bold mt-4 shadow-lg uppercase">Register Profile</button>
            </div>
        </div>
    </div>

<!-- ২. মেইন অ্যাপ ইউআই -->
<div id="appBody" class="hidden min-h-screen">
    <header class="axis-gradient text-white sticky top-0 z-[100] h-[65px] px-5 flex items-center justify-between shadow-lg">
        <div id="headerMain" class="flex justify-between items-center w-full">
            <div class="flex items-center gap-3">
                <div id="userInitials" class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-[10px] font-bold border border-white/20">PB</div>
                <h1 class="text-xl font-black italic">PayBook</h1>
            </div>
            <div class="flex gap-5 items-center">
                <!-- নতুন সার্চ আইকন -->
                <i class="fas fa-search opacity-80 text-lg" onclick="toggleSearchBar()"></i>
                <i class="fas fa-share-nodes opacity-80" onclick="shareApp()"></i>
                <i class="fas fa-file-pdf opacity-80" onclick="askPin(handleSmartPdfDownload)"></i>
                <i class="fas fa-cog opacity-80" onclick="showSettings()"></i>
            </div>
        </div>
        
        <!-- কাস্টমার লেজার হেডার (ব্যাক বাটন সহ) -->
        <!-- লেজার হেডার আপডেট: নামের অংশটি ক্লিকযোগ্য করা হলো -->
<div id="headerLedger" class="hidden flex justify-between items-center w-full">
    <div class="flex items-center gap-4">
        <i class="fas fa-arrow-left" onclick="goHome()"></i>
        <!-- এখানে onclick যোগ করা হয়েছে -->
        <div onclick="openEditPersonModal()" class="cursor-pointer active:opacity-50">
            <h2 id="lName" class="text-sm font-bold leading-none">Client</h2>
            <p id="lPhone" class="text-[9px] text-white/70 mt-1 font-bold tracking-widest"></p>
        </div>
    </div>
    <div class="flex items-center gap-3">
        <i class="fas fa-file-pdf opacity-80 mr-2" onclick="askPin(handleSmartPdfDownload)"></i>
        <span id="mainTotal" class="font-black text-lg tracking-tighter">0.00</span>
        <span id="secretTrigger" class="text-2xl font-black opacity-30 select-none">₹</span>
    </div>
</div>

        <!-- ড্রপডাউন সার্চ বার -->
        <div id="searchBarContainer" class="hidden absolute top-[65px] left-0 right-0 bg-white p-3 shadow-md z-[110] border-b">
            <div class="relative">
                <input type="text" id="searchInput" oninput="renderHome()" placeholder="Search Name or Phone..." 
                       class="w-full p-3 pl-10 rounded-xl bg-slate-100 outline-none border focus:border-[#861F41] text-sm text-slate-700">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <i class="fas fa-times absolute right-4 top-1/2 -translate-y-1/2 text-slate-400" onclick="toggleSearchBar()"></i>
            </div>
        </div>
    </header>

    <div id="mainViewport" class="bg-slate-50">
        <!-- হোম স্ক্রিন -->
        <div id="pageHome" class="flex flex-col">
            <!-- স্টিকি ট্যাব সেকশন (এটি স্ক্রোল হবে না) -->
            <div class="sticky top-0 z-40 bg-slate-50 p-5 pb-2">
                <div class="flex bg-white p-1 rounded-xl border shadow-sm">
                    <button onclick="switchTab('CUSTOMER')" id="tabCust" class="flex-1 py-3 rounded-lg text-xs font-black bg-[#861F41] text-white transition-all">CUSTOMERS</button>
                    <button onclick="switchTab('SUPPLIER')" id="tabSupp" class="flex-1 py-3 rounded-lg text-xs font-black text-slate-400 transition-all">SUPPLIERS</button>
                </div>
            </div>
                <div id="contactList" class="space-y-3"></div>
                <button onclick="openAddModal()" class="fixed bottom-10 right-6 w-16 h-16 axis-gradient text-white rounded-2xl shadow-2xl flex items-center justify-center text-2xl border-4 border-white transition-transform active:scale-90"><i class="fas fa-plus"></i></button>
            </div>

            <!-- লেজার: লেনদেন পেজ -->
            <div id="pageLedger" class="hidden flex flex-col p-4">
                <div id="ledgerList" class="flex flex-col"></div>
                <div class="fixed bottom-8 left-5 right-5 flex gap-3 z-[150]">
                    <button onclick="triggerDrawer('GIVEN')" class="flex-1 py-4 bg-rose-600 text-white rounded-2xl font-black shadow-2xl">↑ GIVEN</button>
                    <button onclick="triggerDrawer('RECEIVED')" class="flex-1 py-4 bg-emerald-600 text-white rounded-2xl font-black shadow-2xl">↓ RECEIVED</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ৩. ডাটা এন্ট্রি ড্রয়ার (Axis Burgundy Theme Update) -->
<div id="entryDrawer" class="fixed inset-0 bg-black/60 hidden">
    <div class="absolute inset-x-0 bottom-0 bg-white rounded-t-[3.5rem] p-10 shadow-2xl animate-fade-up">
        <div class="w-16 h-1.5 bg-slate-100 rounded-full mx-auto mb-10" onclick="closeDrawer()"></div>
        
        <!-- এমাউন্ট এরিয়া: Burgundy কালারে ফিক্সড -->
        <div class="text-center mb-10">
            <p id="drawerActionType" class="text-[10px] font-black text-[#861F41] uppercase tracking-[0.3em] opacity-80">Entry Amount</p>
            <div class="flex items-center justify-center gap-3 mt-4">
                <span class="text-4xl font-black text-[#861F41] opacity-40">₹</span>
                <input type="number" id="txAmt" placeholder="0.00" 
                       class="text-6xl font-black text-[#861F41] bg-transparent outline-none w-3/4 text-center border-b-4 border-slate-50 focus:border-[#861F41] pb-4 transition-all">
            </div>
        </div>

        <div class="space-y-4 mb-10">
            <!-- নোট ইনপুট: আইকন ও টেক্সট Burgundy করা হলো -->
            <div class="flex items-center bg-slate-50 p-5 rounded-3xl gap-4 border border-slate-100">
                <i class="fas fa-file-lines text-[#861F41] text-xl opacity-70"></i>
                <input type="text" id="txNote" placeholder="Add Notes (Bill No/Ref)" 
                       class="bg-transparent outline-none flex-1 text-md text-[#861F41] font-bold placeholder:text-[#861F41]/40">
            </div>

            <!-- নেক্সট কালেকশন ডেট: ল্যাবেল এবং আইকন Burgundy করা হলো -->
            <div class="flex items-center bg-slate-50 p-5 rounded-3xl gap-4 border border-slate-100" 
                 onclick="document.getElementById('nextCollDate').showPicker()">
                <i class="fas fa-hand-holding-dollar text-[#861F41] text-xl opacity-70"></i>
                <div class="flex-1">
                    <p class="text-[8px] font-black text-[#861F41] uppercase tracking-widest opacity-80">Next Collection Date</p>
                    <input type="date" id="nextCollDate" class="bg-transparent outline-none w-full text-sm font-bold text-[#861F41]">
                </div>
                <i class="fas fa-chevron-right text-[#861F41] text-xs opacity-30"></i>
            </div>

            <!-- ট্রানজ্যাকশন ডেট: ল্যাবেল এবং আইকন Burgundy করা হলো -->
            <div class="flex items-center bg-slate-50 p-5 rounded-3xl gap-4 border border-slate-100" 
                 onclick="document.getElementById('txDate').showPicker()">
                <i class="fas fa-calendar-day text-[#861F41] text-xl opacity-70"></i>
                <div class="flex-1">
                    <p class="text-[8px] font-black text-[#861F41] uppercase tracking-widest opacity-80">Transaction Date</p>
                    <input type="date" id="txDate" class="bg-transparent outline-none w-full text-sm font-bold text-[#861F41]">
                </div>
                <i class="fas fa-chevron-right text-[#861F41] text-xs opacity-30"></i>
            </div>

            <!-- ইমেজ সেকশন: হেডলাইন এবং প্লাস বাটন Burgundy করা হলো -->
            <div class="bg-slate-50 p-5 rounded-[2.5rem] border border-slate-100">
                <div class="flex justify-between items-center mb-4 px-1">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-images text-[#861F41] opacity-70"></i>
                        <p class="text-sm font-black text-[#861F41] uppercase tracking-tighter opacity-80">Bill Attachment(s)</p>
                    </div>
                    <span id="imgCounter" class="text-[10px] font-bold text-white bg-[#861F41] px-2 py-1 rounded-full shadow-sm">0 Files</span>
                </div>
                
                <div id="multiImgPreviewContainer" class="flex gap-4 flex-wrap">
                    <button onclick="openMediaSelector()" 
                            class="w-16 h-16 bg-white border-2 border-dashed border-[#861F41]/30 rounded-2xl flex items-center justify-center text-[#861F41] active:scale-90 transition-all shadow-sm">
                        <i class="fas fa-plus-circle text-2xl opacity-70"></i>
                    </button>
                </div>
            </div>
        </div>

        <button id="mainConfirmBtn" 
                class="w-full py-6 bg-emerald-600 text-white rounded-[2rem] font-black shadow-2xl shadow-emerald-100 uppercase tracking-[0.2em] active:scale-95 transition-all">
            Confirm Transaction
        </button>
    </div>
</div>
    <!-- ৪. মিডিয়া, পিন এবং সেটিংস মোডাল (Point 1b, 1c, 1d, 7, 11) -->
    <div id="mediaSheet" class="fixed inset-0 bg-black/60 hidden z-[3000]">
        <div class="absolute inset-x-0 bottom-0 bg-white rounded-t-[2.5rem] p-10 flex justify-around shadow-2xl">
            <button onclick="triggerCamera()" class="flex flex-col items-center gap-3"><div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center text-[#861F41] text-2xl shadow-inner"><i class="fas fa-camera"></i></div><span class="text-xs font-bold uppercase tracking-tighter">Camera</span></button>
            <button onclick="triggerGallery()" class="flex flex-col items-center gap-3"><div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center text-[#861F41] text-2xl shadow-inner"><i class="fas fa-image"></i></div><span class="text-xs font-bold uppercase tracking-tighter">Gallery</span></button>
        </div>
        <input type="file" id="camInp" accept="image/*" capture="camera" class="hidden">
        <input type="file" id="galInp" accept="image/*" class="hidden">
    </div>

    <div id="pinModal" class="hidden fixed inset-0 bg-black/80 z-[4000] flex items-center justify-center p-8">
        <div class="bg-white w-full max-w-sm rounded-[3rem] p-12 text-center shadow-2xl">
            <i class="fas fa-shield-halved text-5xl text-[#861F41] mb-8"></i>
            <h3 class="text-xl font-black mb-10 text-[#861F41] uppercase tracking-widest leading-none">Verification</h3>
            <input type="password" id="confirmPinInput" maxlength="4" class="axis-input text-center pin-box h-14 mb-10 shadow-inner">
            <div class="flex gap-4">
                <button onclick="closePinModal()" class="flex-1 font-bold text-slate-400 uppercase text-[10px]">Go Back</button>
                <button id="pinSubmitBtn" class="flex-1 py-4 bg-[#861F41] text-white rounded-xl font-bold uppercase text-[10px]">Confirm PIN</button>
            </div>
        </div>
    </div>

    <div id="settingsModal" class="hidden fixed inset-0 bg-black/60 z-[1500] flex items-end">
        <div class="flex justify-between items-center mb-6">
    <i class="fas fa-chevron-left text-slate-300" onclick="handleGlobalBack()"></i>
    <h3 class="text-xl font-bold uppercase">Title Here</h3>
    <span></span>
</div>
        <div class="bg-white w-full rounded-t-[3rem] p-10 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-xl font-black text-[#861F41] mb-8 text-center uppercase tracking-widest">Management Center</h3>
            
            <div id="adminControls" class="space-y-3 text-center">
                <!-- ম্যানেজার নিয়োগ (পয়েন্ট ১বি, ৯) -->
                <button onclick="hireManager()" class="w-full p-6 bg-slate-50 rounded-3xl flex justify-between font-bold italic">Hire New Manager <i class="fas fa-user-plus"></i></button>
                <div id="mgrList" class="space-y-2 mb-6"></div>
                <button onclick="askPin(changePin)" class="w-full p-6 bg-slate-50 rounded-3xl flex justify-between font-bold mb-3">Change PIN <i class="fas fa-key"></i></button>
                <button onclick="transferAcc()" class="w-full p-6 bg-slate-50 rounded-2xl flex justify-between font-bold mb-8">Transfer Account <i class="fas fa-exchange"></i></button>
            </div>

            <!-- লগআউট (পয়েন্ট ১ডি) -->
            <button onclick="logout()" class="w-full py-5 bg-rose-50 text-rose-500 font-bold uppercase rounded-3xl border border-rose-100 mb-6"><i class="fas fa-power-off"></i> Secure Logout</button>
            <button onclick="document.getElementById('settingsModal').classList.add('hidden')" class="axis-gradient text-white w-full py-4 rounded-[2rem] font-black shadow-xl">BACK TO LEDGER</button>
        </div>
    </div>

    <!-- ৩.৫. নতুন একাউন্ট খোলার মোডাল (Burgundy & Profile Image Update) -->
<div id="addModal" class="hidden fixed inset-0 bg-black/60 z-[1500] flex items-end">
    <div class="bg-white w-full rounded-t-[3.5rem] p-10 shadow-2xl animate-fade-up">
        <!-- টপ হ্যান্ডেল -->
        <div class="w-12 h-1 bg-slate-100 rounded-full mx-auto mb-8"></div>
        
        <h3 class="text-2xl font-black text-[#861F41] mb-8 text-center uppercase tracking-tighter">New Account</h3>

        <!-- প্রোফাইল ইমেজ সিলেক্টর -->
        <div class="flex flex-col items-center mb-8">
            <div class="relative group">
                <label for="pImgInput" class="w-24 h-24 bg-slate-50 rounded-full border-2 border-dashed border-[#861F41]/30 flex items-center justify-center cursor-pointer overflow-hidden shadow-inner transition-all hover:border-[#861F41]">
                    <i id="pImgPlaceholder" class="fas fa-camera text-[#861F41]/40 text-2xl"></i>
                    <img id="pImgPreview" class="hidden w-full h-full object-cover">
                </label>
                <input type="file" id="pImgInput" accept="image/*" class="hidden">
                <div class="absolute -bottom-1 -right-1 bg-[#861F41] text-white w-7 h-7 rounded-full flex items-center justify-center border-2 border-white shadow-md">
                    <i class="fas fa-plus text-[10px]"></i>
                </div>
            </div>
            <p class="text-[9px] font-black text-[#861F41]/50 uppercase mt-3 tracking-widest">Add Profile Picture</p>
        </div>

        <!-- ইনপুট ফিল্ডস: Burgundy থিম -->
        <div class="space-y-4">
            <div class="relative">
                <i class="fas fa-user absolute left-4 top-1/2 -translate-y-1/2 text-[#861F41]/30 text-sm"></i>
                <input id="newPName" type="text" placeholder="Contact Full Name" 
                       class="axis-input !pl-12 !border-[#861F41]/10 focus:!border-[#861F41] !text-[#861F41] font-bold placeholder:text-[#861F41]/30">
            </div>
            <div class="relative">
                <i class="fas fa-phone-alt absolute left-4 top-1/2 -translate-y-1/2 text-[#861F41]/30 text-sm"></i>
                <input id="newPPhone" type="number" placeholder="Mobile Number (Unique)" 
                       class="axis-input !pl-12 !border-[#861F41]/10 focus:!border-[#861F41] !text-[#861F41] font-bold placeholder:text-[#861F41]/30">
            </div>
        </div>

function syncCloud() {

        // Firestore Real-time Listener (onSnapshot)
        db_fs.collection(COLLECTION).doc(db.admin.phone)
            .onSnapshot((doc) => {

                    const cloudData = doc.data();
                    
                    // বর্তমান লোকাল ডাটা এবং ক্লাউড ডাটা মার্জ করা

                    db.people = cloudData.people || [];
                    db.managers = cloudData.managers || [];
                    db.admin = cloudData.admin;

                    localStorage.setItem(DB_KEY, JSON.stringify(db)); // লোকাল আপডেট
                    renderHome(); // হোম স্ক্রিন রিফ্রেশ
                    console.log("Live Sync: Data Received from Cloud");

            }, (error) => {

            });

async function handleRegistration() {
    const n = document.getElementById('regName').value.trim();
    const ph = document.getElementById('regPhone').value.trim();
    const p = document.getElementById('regPin').value.trim();
    const accessKey = ph + p;

    if(!n || ph.length !== 10 || p.length < 4) {
        return alert("Error: Provide Owner Name, 10-digit Mobile, and 4-digit PIN!");
    }

    try {
        // ১. চেক করা হচ্ছে এই পিন কম্বিনেশন কি অলরেডি বুকড?
        const keyRef = db_fs.collection(ACCESS_KEYS).doc(accessKey);
        const keyDoc = await keyRef.get();
        if(keyDoc.exists) return alert("This PIN is already used for this number. Use another.");

        // ২. মেইন ডাটাবেস চেক করা (অন্য কেউ আমাকে অ্যাড করে রেখেছে কি না)
        const docRef = db_fs.collection(COLLECTION).doc(ph);
        const doc = await docRef.get();

        if (doc.exists) {
            // যদি সুলতান আপনাকে আগেই অ্যাড করে থাকে, তবে ওই ডাটা আপনার প্রোফাইল হবে
            db = doc.data();
            db.admin = { name: n, phone: ph, pin: p }; // এখন আপনিই মালিক
        } else {
            // একদম নতুন একাউন্ট
            db = {
                admin: { name: n, phone: ph, pin: p },
                people: [],
                managers: [],
                secret: false,
                tab: 'CUSTOMER',
                activeId: null,
                role: 'ADMIN',
                opName: n,
                ownerPhone: ph
            };
        }

        // ৩. এক্সেস কি এবং মেইন ডাটা সেভ
        await keyRef.set({ targetOwnerPhone: ph, role: 'ADMIN', name: n });
        await docRef.set(db);

        localStorage.setItem(DB_KEY, JSON.stringify(db));
        alert("Success! Your global account is ready.");
        location.reload();

    } catch(error) {
        alert("Registration Failed! Check internet.");
    }
}
// ৪. লগইন ফাংশন সংশোধন (Point 4: পিন-বেসড ডাইরেক্ট রাউটিং লজিক)
async function handleLogin() {
    const ph = document.getElementById('loginPhone').value.trim();
    const pin = document.getElementById('loginPin').value.trim();
    const accessKey = ph + pin;

    if(ph.length !== 10 || pin.length < 4) return alert("Enter correct Details!");

    try {
        const keyDoc = await db_fs.collection(ACCESS_KEYS).doc(accessKey).get();

        if (keyDoc.exists) {
            const routing = keyDoc.data();
            const docRef = db_fs.collection(COLLECTION).doc(routing.targetOwnerPhone);
            const doc = await docRef.get();

            if (doc.exists) {
                db = JSON.parse(JSON.stringify(doc.data())); 
                db.role = routing.role;
                db.opName = routing.name;
                db.ownerPhone = routing.targetOwnerPhone;
                db.secret = false;

                // --- পয়েন্ট ৯: মিরর কন্টাক্ট ডিসকভারি (নতুন কেউ আমাকে অ্যাড করেছে কি না) ---
                await discoverMirrorUpdates(ph);

                localStorage.setItem(DB_KEY, JSON.stringify(db)); 
                enterApp();
                alert(`Welcome ${routing.name}! Sync Complete.`);
            }
        } else {
            alert("No access found! Please check Phone/PIN or Register.");
        }
    } catch (e) { alert("Login failed! Check internet."); }
}

// এই ফাংশনটি আপনার জন্য অন্য ফোনের ডাটা খুঁজে আনবে
async function discoverMirrorUpdates(myPhone) {
    const allDocs = await db_fs.collection(COLLECTION).get();
    allDocs.forEach(doc => {
        const otherData = doc.data();
        if(otherData.admin.phone === myPhone) return;

        // চেক করা: সে কি আমাকে তার লিস্টে রেখেছে?
        const foundMe = (otherData.people || []).find(p => p.phone === myPhone);
        if(foundMe) {
            const alreadyInMyList = db.people.find(p => p.phone === otherData.admin.phone);
            if(!alreadyInMyList) {
                db.people.unshift({
                    id: Date.now() + Math.random(),
                    name: otherData.admin.name,
                    phone: otherData.admin.phone,
                    type: (foundMe.type === 'CUSTOMER' ? 'SUPPLIER' : 'CUSTOMER'),
                    transactions: foundMe.transactions.map(t => ({ ...t, type: (t.type==='GIVEN'?'RECEIVED':'GIVEN') }))
                });
            }
        }
    });
}

// --- মিরর সিঙ্ক লজিক (Point 9: অটোমেটিক পার্টনার আপডেট) ---
async function syncToPartner(partnerPhone, txData) {
    try {
        const partnerRef = db_fs.collection(COLLECTION).doc(partnerPhone);
        const doc = await partnerRef.get();

        let partnerDB;
        if (doc.exists) {
            partnerDB = doc.data();
        } else {
            // যদি পার্টনার এখনো রেজিস্টার না করে, তার জন্য একটি প্লেসহোল্ডার তৈরি হবে
            partnerDB = { admin: { phone: partnerPhone }, people: [], managers: [] };
        }

        // পার্টনারের লিস্টে আমাকে খুঁজে বের করা
        let meInHisList = partnerDB.people.find(p => p.phone === db.admin.phone);

        if (!meInHisList) {
            meInHisList = {
                id: Date.now(),
                name: db.admin.name,
                phone: db.admin.phone,
                type: (db.tab === 'CUSTOMER' ? 'SUPPLIER' : 'CUSTOMER'), // আমার কাস্টমার মানে ওর সাপ্লায়ার
                transactions: []
            };
            partnerDB.people.unshift(meInHisList);
        }

        // লেনদেন মিরর করা (টাইপ উল্টে যাবে)
        const mirrorTx = {
            ...txData,
            type: (txData.type === 'GIVEN' ? 'RECEIVED' : 'GIVEN'),
            by: db.admin.name + " (Auto-Synced)"
        };

        meInHisList.transactions.push(mirrorTx);
        await partnerRef.set(partnerDB);
        console.log("Global Mirror Sync Done!");

    } catch (e) { console.error("Mirror Sync Error:", e); }
}

        // --- ৩. ক্যালকুলেশন এবং সিক্রেট লজিক (Point 2, 4, 6, 7, 8) ---
        function calcBal(txs, isSec, pType) {
            let b = 0;
            txs.filter(t => t.status==='active' && !!t.secret === !!isSec).forEach(t => {
                if(pType==='CUSTOMER') b += (t.type==='GIVEN' ? t.amount : -t.amount);
                else b += (t.type==='RECEIVED' ? t.amount : -t.amount);
            });
            return b;
        }

        function initSecretGesture() {
            const el = document.getElementById('secretTrigger');
            el.onclick = () => { if(db.secret) exitSecret(); };
            el.onpointerdown = () => { if(!db.secret) holdTimer = setTimeout(() => { askPin(() => { db.secret=true; el.classList.add('blink-secret'); renderAll(); startTimer(); }); }, 2500); };
            el.onpointerup = () => clearTimeout(holdTimer);
        }
        function startTimer() { clearTimeout(autoExitTimer); autoExitTimer = setTimeout(exitSecret, 60000); } 
        function exitSecret() { db.secret = false; document.getElementById('secretTrigger').classList.remove('blink-secret'); renderAll(); }

// --- ২. কাস্টমার/সাপ্লায়ার অ্যাড ফাংশন (Profile Image & Global Check সহ) ---
async function confirmAdd() { 
    const nInput = document.getElementById('newPName');
    const phInput = document.getElementById('newPPhone');
    const pImgInp = document.getElementById('pImgInput'); // প্রোফাইল ইমেজ ইনপুট
    
    const n = nInput.value.trim(); 
    const ph = phInput.value.trim(); 
    
    if(n && ph.length === 10) { 
        const saveBtn = document.querySelector('#addModal button:last-child');
        const originalText = saveBtn.innerText;
        saveBtn.innerText = "PROCESSING..."; // লোডিং টেক্সট
        saveBtn.disabled = true;

        try {
            // ১. গ্লোবাল ডাটাবেস চেক (কালেকশন নাম: global_defaulters)
            const globalDoc = await db_fs.collection("global_defaulters").doc(ph).get();
            let isGlobalBad = false;
            let reporter = "";

            if (globalDoc.exists) {
                const info = globalDoc.data();
                if(info.status === "DEFAULTER") {
                    isGlobalBad = true;
                    reporter = info.reportedBy;
                    const warning = `🚨 SECURITY ALERT: DEFAULTER DETECTED!\n\nThis number was reported by: ${reporter}\n\nDo you still want to add this person?`;
                    if (!confirm(warning)) {
                        saveBtn.innerText = originalText;
                        saveBtn.disabled = false;
                        return;
                    }
                }
            }

            // ২. প্রোফাইল ইমেজ আপলোড লজিক (ImgBB তে যাবে)
            let profilePicUrl = "";
            const file = pImgInp.files[0];
            if (file) {
                saveBtn.innerText = "UPLOADING IMAGE...";
                const fd = new FormData();
                fd.append('image', file);
                const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method:'POST', body:fd });
                const dat = await res.json();
                if(dat.success) profilePicUrl = dat.data.url;
            }

            // ৩. নতুন কন্টাক্ট অবজেক্ট তৈরি
            db.people.unshift({
                id: Date.now(), 
                name: n, 
                phone: ph, 
                type: db.tab, 
                profilePic: profilePicUrl, // এখানে ইমেজের লিঙ্ক সেভ হলো
                isDefaulter: isGlobalBad, 
                missedDates: isGlobalBad ? 3 : 0,
                transactions: []
            }); 

            // ৪. ক্লাউডে এবং লোকাল স্টোরেজে সেভ
            await saveDB(); 
            
            // ৫. ফর্ম ক্লিন এবং মোডাল বন্ধ
            nInput.value = ""; phInput.value = ""; pImgInp.value = "";
            document.getElementById('pImgPreview').classList.add('hidden');
            document.getElementById('pImgPlaceholder').classList.remove('hidden');
            
            saveBtn.innerText = originalText; 
            saveBtn.disabled = false;
            document.getElementById('addModal').classList.add('hidden'); 
            
            renderHome(); // হোম স্ক্রিন রিফ্রেশ
            alert(isGlobalBad ? "Account created with DEFAULTER status." : "Account Created Successfully!");

        } catch (err) {
            console.error("Sync Error:", err);
            alert("Connection Error! Please check internet.");
            saveBtn.innerText = originalText; saveBtn.disabled = false;
        }
    } else {
        alert("Invalid Name or 10-digit Phone Number!"); 
    }
}

        function renderLedger() {
    const p = db.people.find(x => x.id === db.activeId);
    const list = document.getElementById('ledgerList'); 
    list.innerHTML = "";
    
    const net = calcBal(p.transactions, db.secret, p.type);
    const displayHeaderTotal = db.secret ? (Math.abs(net) / 100).toFixed(2) : Math.abs(net).toLocaleString('en-IN');

// --- ৫. ডাটা এন্ট্রি এবং সেভ (Next Collection Date যুক্ত করা হলো) ---
async function preSave(t) {
    const amtInput = document.getElementById('txAmt');
    const amt = parseFloat(amtInput.value); 
    if(!amt || amt <= 0) return alert("Please enter amount!");

    // কালেকশন ডেট ভ্যালু নেওয়া
    const nextDateVal = document.getElementById('nextCollDate')?.value || null;

    const act = async () => {
        const confirmBtn = document.getElementById('mainConfirmBtn');
        confirmBtn.innerText = "SYNCHING CLOUD...";
        confirmBtn.disabled = true;

        try {
            let uploadedImgs = [];
            
            // লুপ চালিয়ে ইমেজগুলো ImgBB-তে আপলোড করা
            const filesToUpload = (typeof capturedFiles !== 'undefined') ? capturedFiles : [];
            for(let file of filesToUpload) {
                const fd = new FormData();
                fd.append('image', file);
                try {
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method:'POST', body:fd });
                    const dat = await res.json();
                    if(dat.success) uploadedImgs.push(dat.data.url);
                } catch(imgErr) { console.error("Img Upload Fail"); }
            }

            const person = db.people.find(x => x.id === db.activeId);
            
            // ১. নতুন ট্রানজ্যাকশন অবজেক্ট তৈরি (Next Collection Date সহ)
            const newTx = { 
                id: Date.now(), 
                amount: amt, 
                type: t, 
                secret: !!db.secret, 
                date: document.getElementById('txDate').value || new Date().toLocaleDateString('en-GB'), 
                note: document.getElementById('txNote').value.trim(), 
                nextCollDate: nextDateVal, // এখানে নেক্সট কালেকশন ডেট সেভ হচ্ছে
                images: uploadedImgs, 
                by: db.opName || 'Owner', 
                status: 'active' 
            };

            // ২. নিজের লিস্টে সেভ করা
            person.transactions.push(newTx);
            await saveDB(); // ক্লাউড সিঙ্ক
            
            // ৩. মিরর সিঙ্ক (পয়েন্ট ৯ অনুযায়ী পার্টনারের ফোনে পাঠানো)
            if (typeof syncToPartner === 'function') {
                await syncToPartner(person.phone, newTx);
            }

            renderLedger(); 
            
            // ৪. কাজ শেষ হলে সব ইনপুট ক্লিয়ার করা (Form Cleaning)
            if(document.getElementById('nextCollDate')) document.getElementById('nextCollDate').value = "";
            if(document.getElementById('txNote')) document.getElementById('txNote').value = "";
            if(document.getElementById('multiImgPreview')) document.getElementById('multiImgPreview').innerHTML = "";
            amtInput.value = "";
            capturedFiles = []; 
            
            closeDrawer(); // ড্রয়ার বন্ধ হবে
            alert("Transaction saved successfully!");

        } catch(error) {
            console.error("Critical Sync Error:", error);
            alert("Failed to sync. Please check internet connection.");
        } finally {
            confirmBtn.innerText = "Confirm Transaction";
            confirmBtn.disabled = false;
        }
    };

    // সিক্রেট মোড পিন ভেরিফিকেশন (কাস্টমারের থেকে টাকা পেলে)
    if(db.secret && db.tab === 'CUSTOMER' && t === 'RECEIVED') {
        askPin(act); 
    } else {
        act();
    }
}

       // --- ৬. স্মার্ট পিডিএফ এবং গ্লোবাল স্টেটমেন্ট জেনারেশন (V17.4 - Footer Total Added) ---
function handleSmartPdfDownload() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('l', 'mm', 'a4'); // Landscape মোড
    const isSec = !!db.secret;
    const isLedger = !document.getElementById('pageLedger').classList.contains('hidden');

    const RED = [225, 29, 72];
    const GREEN = [5, 150, 105];
    const BURGUNDY = [134, 31, 65];

    if (isLedger) {
        // --- ১. ইন্ডিভিজুয়াল লেজার রিপোর্ট ---
        const p = db.people.find(x => x.id === db.activeId);
        
        doc.setFontSize(22);
        doc.setTextColor(BURGUNDY[0], BURGUNDY[1], BURGUNDY[2]);
        doc.text(`PayBook Pro | Account Statement`, 14, 20);
        
        doc.setFontSize(10);
        doc.setTextColor(100);
        doc.text(`Client: ${p.name} | Mobile: +91 ${p.phone} | Category: ${p.type}`, 14, 30);
        doc.text(`Report Mode: ${isSec ? 'Full Audit (Pakka + Kaccha)' : 'Official (Pakka Only)'}`, 14, 35);
        doc.text(`Generated By: ${db.opName || 'Owner'} | Date: ${new Date().toLocaleString()}`, 14, 40);

        const head = isSec 
            ? [['Date', 'Phone', 'Type', 'P-Given (OUT)', 'P-Rec. (IN)', 'K-Given (OUT)', 'K-Rec. (IN)']] 
            : [['Date', 'Phone', 'Type', 'Given (OUT)', 'Received (IN)']];

        const rows = [];
        let tP_G = 0, tP_R = 0, tK_G = 0, tK_R = 0;

        p.transactions.filter(t => t.status === 'active').forEach(t => {
            if (!isSec && t.secret) return; 

            const amt = t.amount;
            if (isSec) {
                let pG="-", pR="-", kG="-", kR="-";
                if(!t.secret) {
                    if(t.type==='GIVEN') { pG = amt.toLocaleString('en-IN'); tP_G+=amt; } else { pR = amt.toLocaleString('en-IN'); tP_R+=amt; }
                } else {
                    if(t.type==='GIVEN') { kG = amt.toLocaleString('en-IN'); tK_G+=amt; } else { kR = amt.toLocaleString('en-IN'); tK_R+=amt; }
                }
                rows.push([
                    t.date, p.phone, p.type, 
                    {content: pG, styles: {textColor: (p.type==='CUSTOMER'?'GIVEN':'RECEIVED')==='GIVEN' && pG!=='-'?RED:GREEN}},
                    {content: pR, styles: {textColor: (p.type==='CUSTOMER'?'GIVEN':'RECEIVED')==='RECEIVED' && pR!=='-'?GREEN:RED}},
                    {content: kG, styles: {textColor: RED}},
                    {content: kR, styles: {textColor: GREEN}}
                ]);
            } else {
                if(t.type==='GIVEN') tP_G+=amt; else tP_R+=amt;
                rows.push([
                    t.date, p.phone, p.type,
                    {content: t.type==='GIVEN' ? amt.toLocaleString('en-IN') : "-", styles: {textColor: (p.type==='CUSTOMER'?'GIVEN':'RECEIVED')==='GIVEN'?RED:GREEN}},
                    {content: t.type==='RECEIVED' ? amt.toLocaleString('en-IN') : "-", styles: {textColor: (p.type==='CUSTOMER'?'GIVEN':'RECEIVED')==='RECEIVED'?GREEN:RED}}
                ]);
            }
        });

        // কলাম অনুযায়ী ফুটার তৈরি (পয়েন্ট অনুযায়ী টোটাল রো)
        let footer = isSec 
            ? [['TOTAL', '', '', tP_G.toLocaleString('en-IN'), tP_R.toLocaleString('en-IN'), tK_G.toLocaleString('en-IN'), tK_R.toLocaleString('en-IN')]]
            : [['TOTAL', '', '', tP_G.toLocaleString('en-IN'), tP_R.toLocaleString('en-IN')]];

        doc.autoTable({
            startY: 45, head: head, body: rows, foot: footer, theme: 'grid',
            headStyles: { fillColor: BURGUNDY },
            footStyles: { fillColor: [240, 240, 240], textColor: [0, 0, 0], fontStyle: 'bold' },
            styles: { fontSize: 8, cellPadding: 3, font: 'helvetica' }
        });

        let finalY = doc.lastAutoTable.finalY + 15;
        let netBalance = isSec ? ((tP_G - tP_R) + (tK_G - tK_R)) : (tP_G - tP_R);

        doc.setFontSize(12);
        doc.setTextColor(0, 0, 0);
        doc.text("FINAL SUMMARY:", 14, finalY);
        doc.setFontSize(14);
        if (netBalance > 0) {
            doc.setTextColor(RED[0], RED[1], RED[2]);
            doc.text(`NET BALANCE DUE (OUTSTANDING): Rs. ${netBalance.toLocaleString('en-IN')}`, 14, finalY + 12);
        } else {
            doc.setTextColor(GREEN[0], GREEN[1], GREEN[2]);
            doc.text(`NET BALANCE CLEAR (ADVANCE/SETTLED): Rs. ${Math.abs(netBalance).toLocaleString('en-IN')}`, 14, finalY + 12);
        }

        doc.save(`${p.name}_Statement.pdf`);

    } else {
        // --- ২. গ্লোবাল বিজনেস সামারি রিপোর্ট ---
        doc.setFontSize(20);
        doc.setTextColor(BURGUNDY[0], BURGUNDY[1], BURGUNDY[2]);
        doc.text(`Business Portfolio Summary`, 14, 20);
        doc.setFontSize(10);
        doc.setTextColor(100);
        doc.text(`Generated: ${new Date().toLocaleString()}`, 14, 28);

        const head = isSec 
            ? [['Name', 'Mobile', 'Type', 'Pakka Balance', 'Kaccha Balance', 'Net Total']] 
            : [['Name', 'Mobile', 'Type', 'Current Balance']];

        let gP = 0, gK = 0;
        const rows = db.people.map(p => {
            let pB=0, kB=0;
            p.transactions.filter(t => t.status==='active').forEach(t => {
                let v = (t.type==='RECEIVED' ? -t.amount : t.amount);
                if(t.secret) kB += v; else pB += v;
            });
            gP += pB; gK += kB;

            if(isSec) {
                let net = pB + kB;
                return [p.name, p.phone, p.type, pB.toLocaleString('en-IN'), kB.toLocaleString('en-IN'), {content: "Rs. "+net.toLocaleString('en-IN'), styles: {textColor: net > 0 ? RED : GREEN}}];
            } else {
                return [p.name, p.phone, p.type, {content: "Rs. "+pB.toLocaleString('en-IN'), styles: {textColor: pB > 0 ? RED : GREEN}}];
            }
        });

        let gFooter = isSec 
            ? [['GRAND TOTAL', '', '', gP.toLocaleString('en-IN'), gK.toLocaleString('en-IN'), (gP+gK).toLocaleString('en-IN')]]
            : [['GRAND TOTAL', '', '', gP.toLocaleString('en-IN')]];

        doc.autoTable({ 
            startY: 35, head: head, body: rows, foot: gFooter,
            headStyles: {fillColor: BURGUNDY}, 
            footStyles: {fillColor: [240, 240, 240], textColor: [0,0,0], fontStyle: 'bold'},
            theme: 'striped', styles: { font: 'helvetica' } 
        });
        doc.save("Full_Business_Summary.pdf");
    }
}

        // ৩. ক্লাউডে সেভ করা (await ব্যবহার করুন)
        await saveDB(); 
        
        document.getElementById('editPersonModal').classList.add('hidden');
        renderHome(); // হোম লিস্ট আপডেট
        alert("Account Updated Successfully!");
    }
}
        // ৩. ম্যানেজার নিয়োগ ফাংশন সংশোধন (Point 3: গ্লোবাল পিন রাউটিং লজিক সহ)
async function hireManager() {
    const n = prompt("Enter Manager Name:");
    if (!n) return;
    const ph = prompt("Enter Manager 10-Digit Mobile Number:");
    if (!ph || ph.length !== 10) return alert("Error: Provide a valid 10-digit mobile number!");
    const p = prompt("Set a 4-Digit Secure PIN for this Manager:");
    if (!p || p.length !== 4) return alert("Error: PIN must be exactly 4 digits!");

    const accessKey = ph + p; // ম্যানেজারের নম্বর + পিন = ইউনিক আইডি

    try {
        // ১. চেক করা হচ্ছে এই ফোন এবং পিন কম্বিনেশন কি অন্য কোনো এডমিন অলরেডি ব্যবহার করছে?
        const keyRef = db_fs.collection(ACCESS_KEYS).doc(accessKey);
        const keyDoc = await keyRef.get();

        if (keyDoc.exists) {
            return alert("Error: This Phone and PIN combination is already registered. Please choose a different PIN for this manager.");
        }

        // ২. এডমিনের ম্যানেজার লিস্টে (Local DB) তথ্য যোগ করা
        if (!db.managers) db.managers = [];
        db.managers.push({
            id: Date.now(),
            name: n,
            phone: ph,
            pin: p
        });

        // ৩. এক্সেস কি (Access Key) কালেকশনে ম্যানেজারের রাউটিং ইনফো সেভ করা
        // এটিই সবচেয়ে গুরুত্বপূর্ণ ধাপ: পিনটিকে এডমিনের ফোন নম্বরের সাথে লিঙ্ক করা হচ্ছে
        await keyRef.set({
            targetOwnerPhone: db.admin.phone, // এই পিন দিলে এডমিনের ডাটাবেস খুলবে
            role: 'MANAGER',
            name: n
        });

        // ৪. এডমিনের মেইন ডাটাবেস ক্লাউডে আপডেট করা
        await saveDB();

        // ৫. লিস্ট রিফ্রেশ করা
        renderManagers(); 
        alert(`Success! ${n} is now hired as a Manager. They can login using PIN: ${p}`);

    } catch (error) {
        console.error("Hiring System Error:", error);
        alert("Failed to hire manager. Please check your internet connection.");
    }
}

function handleGlobalBack() {
    const isLedgerVisible = !document.getElementById('pageLedger').classList.contains('hidden');
    const isDrawerOpen = !document.getElementById('entryDrawer').classList.contains('hidden');
    const isSettingsOpen = !document.getElementById('settingsModal').classList.contains('hidden');
    const isAddModalOpen = !document.getElementById('addModal').classList.contains('hidden');
    const isMediaSheetOpen = !document.getElementById('mediaSheet').classList.contains('hidden');

    // প্রায়োরিটি অনুযায়ী ব্যাক করা
    if (isMediaSheetOpen) {
        document.getElementById('mediaSheet').classList.add('hidden'); // মিডিয়া বন্ধ
    } else if (isDrawerOpen) {
        closeDrawer(); // ডাটা এন্ট্রি বন্ধ
    } else if (isSettingsOpen) {
        document.getElementById('settingsModal').classList.add('hidden'); // সেটিংস বন্ধ
    } else if (isAddModalOpen) {
        document.getElementById('addModal').classList.add('hidden'); // কাস্টমার এন্ট্রি বন্ধ
    } else if (isLedgerVisible) {
        goHome(); // কাস্টমার লেজার থেকে হোমে ফেরা
    } else {
        // যদি অলরেডি হোম স্ক্রিনে থাকে, তবে ইউজারকে জানানো যেতে পারে
        console.log("Already on Home Screen");
    }
}

function renderHome() {
    const list = document.getElementById('contactList'); 
    const searchVal = document.getElementById('searchInput')?.value.toLowerCase() || "";
    if(!list) return;
    list.innerHTML = "";
    
    document.getElementById('headerMain').classList.remove('hidden'); 
    document.getElementById('headerLedger').classList.add('hidden');
    
    const filteredPeople = db.people.filter(p => {
        const matchesTab = p.type === db.tab;
        const nameMatch = (p.name || "").toLowerCase().includes(searchVal);
        const phoneMatch = (p.phone || "").includes(searchVal);
        return matchesTab && (nameMatch || phoneMatch);
    });

    filteredPeople.forEach(p => {
        const bal = calcBal(p.transactions, db.secret, p.type);
        const dAmt = db.secret ? (Math.abs(bal)/100).toFixed(2) : Math.abs(bal).toLocaleString('en-IN');
        
        // ১. ওডি এবং ডিফোল্টার ক্যালকুলেশন
        let missedCount = 0;
        const today = new Date().setHours(0,0,0,0);
        (p.transactions || []).forEach(tx => {
            if (tx.status === 'active' && tx.nextCollDate) {
                const promised = new Date(tx.nextCollDate).setHours(0,0,0,0);
                if (today > promised) missedCount++;
            }
        });

        // ২. প্রোফাইল ইমেজ লজিক (ক্লিক করলে জুম হবে - Point Update)
        const userAvatar = p.profilePic ? 
            `<img src="${p.profilePic}" class="w-12 h-12 rounded-2xl object-cover shadow-lg border border-white cursor-zoom-in" 
                  onclick="event.stopPropagation(); openZoom('${p.profilePic}')">` : 
            `<div class="w-12 h-12 axis-gradient text-white rounded-2xl flex items-center justify-center font-black text-xl shadow-lg border border-white/20">${(p.name || 'U')[0]}</div>`;

        // ৩. ব্যাজ লজিক
        const isDef = (missedCount >= 3) || (p.isDefaulter === true);
        const defBadge = isDef ? `<span class="blink-secret ml-2 px-2 py-0.5 bg-white text-[#dc2626] border-2 border-[#dc2626] text-[8px] font-black rounded uppercase shadow-sm">DEFAULTER</span>` : "";
        const odBadge = (missedCount > 0) ? `<span class="ml-2 px-1.5 py-0.5 bg-white text-[#f59e0b] border border-[#f59e0b] text-[7px] font-black rounded uppercase">OD-${missedCount}</span>` : "";

        // ৪. রেন্ডারিং
        list.innerHTML += `
            <div class="axis-card p-5 flex justify-between items-center active:scale-95 transition-all mb-3 border border-slate-100 shadow-sm relative overflow-hidden">
                <div onclick="openLedger(${p.id})" class="flex items-center gap-4 flex-1 cursor-pointer">
                    ${userAvatar}
                    <div class="flex flex-col">
                        <div class="flex items-center">
                            <h4 class="font-bold text-sm text-slate-800 tracking-tight">${p.name}</h4>
                            ${odBadge}
                        </div>
                        <div class="flex items-center mt-1">
                            <p class="text-[10px] text-slate-400 font-bold tracking-widest">${p.phone}</p>
                            ${defBadge}
                        </div>
                    </div>
                </div>
                
                <div class="text-right flex items-center gap-4">
                    <div onclick="openLedger(${p.id})" class="cursor-pointer">
                        <h5 class="font-black text-sm ${bal > 0 ? 'text-rose-600' : 'text-emerald-600'}">₹${dAmt}</h5>
                        <p class="text-[7px] font-bold text-slate-300 uppercase tracking-tighter">${bal > 0 ? 'DUE' : 'CLEAR'}</p>
                    </div>
                    
                    <div class="flex flex-col gap-2 border-l border-slate-100 pl-3">
                        <i onclick="event.stopPropagation(); openEditPersonModal(${p.id})" 
                           class="fas fa-user-edit text-[16px] text-indigo-300 hover:text-[#861F41] p-1 cursor-pointer"></i>
                        <i onclick="event.stopPropagation(); deletePerson(${p.id})" 
                           class="fas fa-trash-alt text-[16px] text-slate-200 hover:text-rose-500 p-1 cursor-pointer"></i>
                    </div>
                </div>
            </div>`;
    });

    if(filteredPeople.length === 0) {
        list.innerHTML = `<div class="text-center py-24 opacity-30 uppercase font-black text-[10px] tracking-[0.2em] text-slate-400">No Profile Found</div>`;
    }
}
// ৫. কাস্টমার লিস্ট থেকে সরাসরি এডিট করার জন্য হেল্পার ফাংশন

function removeImage(index) {
    // ১. গ্লোবাল অ্যারে থেকে ছবিটি বাদ দেওয়া
    capturedFiles.splice(index, 1);

        function renderThumbnails() {
    const container = document.getElementById('multiImgPreview');
    if(!container) return;
    
    container.innerHTML = ""; // আগের প্রিভিউ ক্লিয়ার করা
    
    capturedFiles.forEach((file, index) => {
        const url = URL.createObjectURL(file);
        
        // প্রতিটি ইমেজের জন্য একটি কন্টেইনার এবং ক্রস বাটন তৈরি
        container.innerHTML += `
            <div class="relative w-14 h-14 mr-1 mb-1">
                <img src="${url}" class="w-full h-full object-cover rounded-lg border shadow-sm">
                <!-- লাল ক্রস বাটন -->
                <div onclick="removeImage(${index})" 
                     class="absolute -top-2 -right-2 bg-white text-rose-500 rounded-full w-5 h-5 flex items-center justify-center shadow-md border border-slate-100 cursor-pointer active:scale-90 transition-transform">
                    <i class="fas fa-times-circle text-[12px]"></i>
                </div>
            </div>
        `;
    });
    
    // যদি কোনো ছবি না থাকে তবে কন্টেইনার হাইড রাখা
    if(capturedFiles.length > 0) {
        container.classList.remove('hidden');
    } else {
        container.classList.add('hidden');
    }
}
        function handleImageFiles(f) {

        :root { --axis-burgundy: #861F41; --axis-grey: #F4F7F9; }

        /* ট্রানজ্যাকশন বাবল (পয়েন্ট ৫: Given/Received চেনা যাবে) */

        .bubble-right { align-self: flex-end; border-right: 5px solid #10b981; border-top-right-radius: 0; }

        /* পিন ইনপুট (পয়েন্ট ৮: ছোট এবং স্মার্ট) */

    <script>
        // --- ১. গ্লোবাল কনফিগ এবং ফায়ারবেস (Point 13) ---
        // --- ১. গ্লোবাল কনফিগ এবং ফায়ারবেস (V18: পিন-বেসড রাউটিং ফিক্স) ---
const firebaseConfig = { 
    apiKey: "AIzaSyD0j438UHEozebvHUnoJK58-YT3Sv4JbQQ", 
    authDomain: "paybook-cc6be.firebaseapp.com", 
    projectId: "paybook-cc6be", 
    storageBucket: "paybook-cc6be.firebasestorage.app", 
    messagingSenderId: "1000801647538", 
    appId: "1:1000801647538:web:648ac804d8d75a0811c2ab", 
    measurementId: "G-TFX1Y6FH29" 
};

// ফায়ারবেস ইনিশিয়ালাইজেশন
firebase.initializeApp(firebaseConfig);
const db_fs = firebase.firestore();

// কনস্ট্যান্টস (Constants)
const IMGBB_KEY = '493904e927fb86161e0a4944d5b28de6';
const MASTER_PIN = "5000"; 
const COLLECTION = "global_paybook_ledgers"; // যেখানে মূল হিসাব থাকবে
const ACCESS_KEYS = "access_keys"; // রাউটিং এর জন্য নতুন কালেকশন (পয়েন্ট ৯ ফিক্স)
const DB_KEY = 'PayBook_V18_Master_Verified'; // নতুন ভার্সন কী

// গ্লোবাল স্টেট (App State)
let db = { 
    admin: null, 
    people: [], 
    managers: [], 
    secret: false, 
    tab: 'CUSTOMER', 
    activeId: null, 
    role: 'ADMIN', // ADMIN অথবা MANAGER
    opName: '', 
    ownerPhone: '' // এই কি-টি দিয়ে ডাটা লোড হবে
};

let holdTimer, autoExitTimer, capturedImgFiles = [];

        // --- ২. স্টার্টআপ এবং অথ লজিক (পয়েন্ট ১এ, ৯, ১২, ১৪) ---
        window.onload = () => {
    const data = localStorage.getItem(DB_KEY);
    if(data) {
        db = JSON.parse(data);
        
        // অ্যাপ রিফ্রেশ করলে সর্বদা সিক্রেট মোড অফ হয়ে যাবে
        db.secret = false; 
        localStorage.setItem(DB_KEY, JSON.stringify(db)); // পাক্কা স্টেট সেভ করা হলো
        
        if(db.admin && db.admin.phone) { 
            toggleAuth('LOGIN'); 
            syncCloud(); 
        } else {
            toggleAuth('REG');
        }
    } else {
        toggleAuth('REG');
    }
    
    // UI থেকে সিক্রেট ব্লিনকিং ইফেক্ট সরিয়ে ফেলা
    const trigger = document.getElementById('secretTrigger');
    if(trigger) trigger.classList.remove('blink-secret', 'text-rose-500');

    initSecretGesture();
    setupHistoryBack();
    
    document.getElementById('camInp').onchange = e => handleImageFiles(e.target.files[0]);
    document.getElementById('galInp').onchange = e => handleImageFiles(e.target.files[0]);
};
    // ১. ডাটাবেস সেভ ফাংশন (V18.1: পিন-বেসড রাউটিং সাপোর্ট)
async function saveDB() {
    // লোকাল ফোনে আগে সেভ (অফলাইন সাপোর্ট)
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    
    // কার ডাটাবেসে সেভ হবে? (মালিকের ফোন নম্বর ব্যবহার করা হচ্ছে)
    const targetDocId = db.ownerPhone || (db.admin ? db.admin.phone : null);

    if (targetDocId) {
        try {
            await db_fs.collection(COLLECTION).doc(targetDocId).set(db);
            console.log("Global Cloud Sync: Success ✅");
        } catch (e) {
            console.error("Cloud Sync Failed:", e);
        }
    }
}
        // --- লাইভ ক্লাউড সিঙ্ক (যাতে অন্য কেউ এন্ট্রি দিলে সাথে সাথে স্ক্রিনে ভেসে ওঠে) ---
function syncCloud() {
    if(db.admin && db.admin.phone) {
        // Firestore Real-time Listener (onSnapshot)
        db_fs.collection(COLLECTION).doc(db.admin.phone)
            .onSnapshot((doc) => {

                    db.people = cloudData.people || [];

async function handleRegistration() {
    const n = document.getElementById('regName').value.trim();
    const ph = document.getElementById('regPhone').value.trim();
    const p = document.getElementById('regPin').value.trim();
    const accessKey = ph + p;

    if(!n || ph.length !== 10 || p.length < 4) {
        return alert("Error: Provide Owner Name, 10-digit Mobile, and 4-digit PIN!");
    }

    try {
        // ১. চেক করা হচ্ছে এই পিন কম্বিনেশন কি অলরেডি বুকড?
        const keyRef = db_fs.collection(ACCESS_KEYS).doc(accessKey);
        const keyDoc = await keyRef.get();
        if(keyDoc.exists) return alert("This PIN is already used for this number. Use another.");

        // ২. মেইন ডাটাবেস চেক করা (অন্য কেউ আমাকে অ্যাড করে রেখেছে কি না)
        const docRef = db_fs.collection(COLLECTION).doc(ph);
        const doc = await docRef.get();

        if (doc.exists) {
            // যদি সুলতান আপনাকে আগেই অ্যাড করে থাকে, তবে ওই ডাটা আপনার প্রোফাইল হবে
            db = doc.data();
            db.admin = { name: n, phone: ph, pin: p }; // এখন আপনিই মালিক
        } else {
            // একদম নতুন একাউন্ট
            db = {
                admin: { name: n, phone: ph, pin: p },
                people: [],
                managers: [],
                secret: false,
                tab: 'CUSTOMER',
                activeId: null,
                role: 'ADMIN',
                opName: n,
                ownerPhone: ph
            };
        }

        // ৩. এক্সেস কি এবং মেইন ডাটা সেভ
        await keyRef.set({ targetOwnerPhone: ph, role: 'ADMIN', name: n });
        await docRef.set(db);

        localStorage.setItem(DB_KEY, JSON.stringify(db));
        alert("Success! Your global account is ready.");
        location.reload();

    } catch(error) {
        alert("Registration Failed! Check internet.");
    }
}
// ৪. লগইন ফাংশন সংশোধন (Point 4: পিন-বেসড ডাইরেক্ট রাউটিং লজিক)
async function handleLogin() {
    const ph = document.getElementById('loginPhone').value.trim();
    const pin = document.getElementById('loginPin').value.trim();
    const accessKey = ph + pin;

    if(ph.length !== 10 || pin.length < 4) return alert("Enter correct Details!");

    try {
        const keyDoc = await db_fs.collection(ACCESS_KEYS).doc(accessKey).get();

        if (keyDoc.exists) {
            const routing = keyDoc.data();
            const docRef = db_fs.collection(COLLECTION).doc(routing.targetOwnerPhone);
            const doc = await docRef.get();

            if (doc.exists) {
                db = JSON.parse(JSON.stringify(doc.data())); 
                db.role = routing.role;
                db.opName = routing.name;
                db.ownerPhone = routing.targetOwnerPhone;
                db.secret = false;

                // --- পয়েন্ট ৯: মিরর কন্টাক্ট ডিসকভারি (নতুন কেউ আমাকে অ্যাড করেছে কি না) ---
                await discoverMirrorUpdates(ph);

                localStorage.setItem(DB_KEY, JSON.stringify(db)); 
                enterApp();
                alert(`Welcome ${routing.name}! Sync Complete.`);
            }
        } else {
            alert("No access found! Please check Phone/PIN or Register.");
        }
    } catch (e) { alert("Login failed! Check internet."); }
}

// এই ফাংশনটি আপনার জন্য অন্য ফোনের ডাটা খুঁজে আনবে
async function discoverMirrorUpdates(myPhone) {
    const allDocs = await db_fs.collection(COLLECTION).get();
    allDocs.forEach(doc => {
        const otherData = doc.data();
        if(otherData.admin.phone === myPhone) return;

        // চেক করা: সে কি আমাকে তার লিস্টে রেখেছে?
        const foundMe = (otherData.people || []).find(p => p.phone === myPhone);
        if(foundMe) {
            const alreadyInMyList = db.people.find(p => p.phone === otherData.admin.phone);
            if(!alreadyInMyList) {
                db.people.unshift({
                    id: Date.now() + Math.random(),
                    name: otherData.admin.name,
                    phone: otherData.admin.phone,
                    type: (foundMe.type === 'CUSTOMER' ? 'SUPPLIER' : 'CUSTOMER'),
                    transactions: foundMe.transactions.map(t => ({ ...t, type: (t.type==='GIVEN'?'RECEIVED':'GIVEN') }))
                });
            }
        }
    });
}

// --- মিরর সিঙ্ক লজিক (Point 9: অটোমেটিক পার্টনার আপডেট) ---
// ৩. মিরর সিঙ্ক ফাংশন (পয়েন্ট ৯)
async function syncToPartner(partnerPhone, txData) {
    try {
        const partnerRef = db_fs.collection(COLLECTION).doc(partnerPhone);
        const doc = await partnerRef.get();

        let partnerDB;
        if (doc.exists) {
            partnerDB = doc.data();
        } else {
            // যদি পার্টনার এখনো রেজিস্টার না করে, তার জন্য একটি প্লেসহোল্ডার তৈরি হবে
            partnerDB = { admin: { phone: partnerPhone }, people: [], managers: [] };
        }

        // পার্টনারের লিস্টে আমাকে খুঁজে বের করা
        let meInHisList = partnerDB.people.find(p => p.phone === db.admin.phone);

        if (!meInHisList) {
            meInHisList = {
                id: Date.now(),
                name: db.admin.name,
                phone: db.admin.phone,
                type: (db.tab === 'CUSTOMER' ? 'SUPPLIER' : 'CUSTOMER'), // আমার কাস্টমার মানে ওর সাপ্লায়ার
                transactions: []
            };
            partnerDB.people.unshift(meInHisList);
        }

        // লেনদেন মিরর করা (টাইপ উল্টে যাবে)
        const mirrorTx = {
            ...txData,
            type: (txData.type === 'GIVEN' ? 'RECEIVED' : 'GIVEN'),
            by: db.admin.name + " (Auto-Synced)"
        };

        meInHisList.transactions.push(mirrorTx);
        await partnerRef.set(partnerDB);
        console.log("Global Mirror Sync Done!");

    } catch (e) { console.error("Mirror Sync Error:", e); }
}

        // --- ৩. ক্যালকুলেশন এবং সিক্রেট লজিক (Point 2, 4, 6, 7, 8) ---
        function calcBal(txs, isSec, pType) {
            let b = 0;
            txs.filter(t => t.status==='active' && !!t.secret === !!isSec).forEach(t => {
                if(pType==='CUSTOMER') b += (t.type==='GIVEN' ? t.amount : -t.amount);
                else b += (t.type==='RECEIVED' ? t.amount : -t.amount);
            });
            return b;
        }

        function initSecretGesture() {
            const el = document.getElementById('secretTrigger');
            el.onclick = () => { if(db.secret) exitSecret(); };
            el.onpointerdown = () => { if(!db.secret) holdTimer = setTimeout(() => { askPin(() => { db.secret=true; el.classList.add('blink-secret'); renderAll(); startTimer(); }); }, 2500); };
            el.onpointerup = () => clearTimeout(holdTimer);
        }
        function startTimer() { clearTimeout(autoExitTimer); autoExitTimer = setTimeout(exitSecret, 60000); } 
        function exitSecret() { db.secret = false; document.getElementById('secretTrigger').classList.remove('blink-secret'); renderAll(); }

        // --- ৪. লেজার এবং ভিউ (পয়েন্ট ২, ৫, ৯, ১০, ১১) ---

async function preSave(type) {
    const amtInput = document.getElementById('txAmt');
    const amt = parseFloat(amtInput.value);
    
    if(!amt || amt <= 0) return alert("Please enter a valid amount!");

    const action = async () => {
        const btn = document.getElementById('mainConfirmBtn');
        btn.innerText = "SYNCHING CLOUD...";
        btn.disabled = true;

        try {
            // ১. মাল্টিপল ইমেজ আপলোড
            let uploadedImages = [];
            const files = (typeof capturedFiles !== 'undefined') ? capturedFiles : [];

            for (let f of files) {
                const fd = new FormData();
                fd.append('image', f);
                try {
                    const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method:'POST', body:fd });
                    const dat = await res.json();
                    if(dat.success) uploadedImages.push(dat.data.url);
                } catch(err) { console.error("Image Upload Failed"); }
            }

            // ২. নতুন ট্রানজ্যাকশন অবজেক্ট তৈরি
            const newTx = {
                id: Date.now(),
                amount: amt,
                type: type,
                secret: !!db.secret,
                date: document.getElementById('txDate').value || new Date().toLocaleDateString('en-GB'),
                note: document.getElementById('txNote').value.trim() || "No Reference",
                images: uploadedImages,
                by: db.opName || 'Owner', // ম্যানেজার নাকি এডমিন তা সেভ হলো
                status: 'active'
            };

            const person = db.people.find(x => x.id === db.activeId);
            
            // ৩. নিজের লিস্টে সেভ করা
            person.transactions.push(newTx);
            await saveDB(); 

            // ৪. পয়েন্ট ৯: মিরর সিঙ্ক (পার্টনারের ফোনে অটো আপডেট পাঠানো)
            await syncToPartner(person.phone, newTx);

            // ৫. ইউআই ক্লিন এবং আপডেট
            renderLedger(); 
            closeDrawer();
            alert("Transaction Successfully Synced!");

        } catch (error) {
            console.error("PreSave Critical Error:", error);
            alert("Sync Failed! Please check your internet connection.");
        } finally {
            btn.innerText = "Confirm Transaction";
            btn.disabled = false;
            if(db.secret) startTimer(); // সিক্রেট মোড হলে ১ মিনিটের টাইমার শুরু হবে
        }
    };

    // সিক্রেট পিন ভেরিফিকেশন (শুধুমাত্র কাঁচা মোডে কাস্টমার পেমেন্টে)
    if(db.secret && db.tab === 'CUSTOMER' && type === 'RECEIVED') {
        askPin(action); 
    } else {
        action();
    }
}

function handleSmartPdfDownload() {

    const isSec = !!db.secret;
    const isLedger = !document.getElementById('pageLedger').classList.contains('hidden');

    const RED = [225, 29, 72];
    const GREEN = [5, 150, 105];
    const BURGUNDY = [134, 31, 65];

    if (isLedger) {
        // --- ১. ইন্ডিভিজুয়াল লেজার রিপোর্ট ---
        const p = db.people.find(x => x.id === db.activeId);
        
        doc.setFontSize(22);
        doc.setTextColor(BURGUNDY[0], BURGUNDY[1], BURGUNDY[2]);
        doc.text(`PayBook Pro | Account Statement`, 14, 20);
        
        doc.setFontSize(10);
        doc.setTextColor(100);
        doc.text(`Client: ${p.name} | Mobile: +91 ${p.phone} | Category: ${p.type}`, 14, 30);
        doc.text(`Report Mode: ${isSec ? 'Full Audit (Pakka + Kaccha)' : 'Official (Pakka Only)'}`, 14, 35);
        doc.text(`Generated By: ${db.opName || 'Owner'} | Date: ${new Date().toLocaleString()}`, 14, 40);

        const head = isSec 
            ? [['Date', 'Phone', 'Type', 'P-Given (OUT)', 'P-Rec. (IN)', 'K-Given (OUT)', 'K-Rec. (IN)']] 
            : [['Date', 'Phone', 'Type', 'Given (OUT)', 'Received (IN)']];

        const rows = [];
        let tP_G = 0, tP_R = 0, tK_G = 0, tK_R = 0;

        // --- পিডিএফ এর ভেতরে কালার লজিক সংশোধন ---
p.transactions.filter(t => t.status === 'active').forEach(t => {
    const amt = t.amount;
    
    // ১. কাস্টমার এবং সাপ্লায়ারের জন্য আলাদা রেড/গ্রিন লজিক
    let isRed = false;
    if (p.type === 'CUSTOMER') {
        isRed = (t.type === 'GIVEN'); // কাস্টমারকে দিলে লাল
    } else {
        isRed = (t.type === 'RECEIVED'); // সাপ্লায়ারের থেকে নিলে লাল
    }

    const cellColor = isRed ? [225, 29, 72] : [5, 150, 105]; // Axis Red vs Emerald Green

    if (isSecret) {
        // সিক্রেট মোডে কলাম ওয়াইজ কালার সেট করা
        let pG="-", pR="-", kG="-", kR="-";
        let pG_Color = [0,0,0], pR_Color = [0,0,0], kG_Color = [0,0,0], kR_Color = [0,0,0];

        if(!t.secret) {
            if(t.type==='GIVEN') { pG = amt.toLocaleString(); pG_Color = cellColor; } 
            else { pR = amt.toLocaleString(); pR_Color = cellColor; }
        } else {
            if(t.type==='GIVEN') { kG = amt.toLocaleString(); kG_Color = cellColor; } 
            else { kR = amt.toLocaleString(); kR_Color = cellColor; }
        }
        
        rows.push([
            t.date, 
            p.phone, 
            p.type,
            {content: pG, styles: {textColor: pG_Color}},
            {content: pR, styles: {textColor: pR_Color}},
            {content: kG, styles: {textColor: kG_Color}},
            {content: kR, styles: {textColor: kR_Color}}
        ]);
    }
});

        // কলাম অনুযায়ী ফুটার তৈরি (পয়েন্ট অনুযায়ী টোটাল রো)
        let footer = isSec 
            ? [['TOTAL', '', '', tP_G.toLocaleString('en-IN'), tP_R.toLocaleString('en-IN'), tK_G.toLocaleString('en-IN'), tK_R.toLocaleString('en-IN')]]
            : [['TOTAL', '', '', tP_G.toLocaleString('en-IN'), tP_R.toLocaleString('en-IN')]];

        doc.autoTable({
            startY: 45, head: head, body: rows, foot: footer, theme: 'grid',
            headStyles: { fillColor: BURGUNDY },
            footStyles: { fillColor: [240, 240, 240], textColor: [0, 0, 0], fontStyle: 'bold' },
            styles: { fontSize: 8, cellPadding: 3, font: 'helvetica' }
        });

        let finalY = doc.lastAutoTable.finalY + 15;
        let netBalance = isSec ? ((tP_G - tP_R) + (tK_G - tK_R)) : (tP_G - tP_R);

        doc.setFontSize(12);
        doc.setTextColor(0, 0, 0);
        doc.text("FINAL SUMMARY:", 14, finalY);
        doc.setFontSize(14);
        if (netBalance > 0) {
            doc.setTextColor(RED[0], RED[1], RED[2]);
            doc.text(`NET BALANCE DUE (OUTSTANDING): Rs. ${netBalance.toLocaleString('en-IN')}`, 14, finalY + 12);
        } else {
            doc.setTextColor(GREEN[0], GREEN[1], GREEN[2]);
            doc.text(`NET BALANCE CLEAR (ADVANCE/SETTLED): Rs. ${Math.abs(netBalance).toLocaleString('en-IN')}`, 14, finalY + 12);
        }

        doc.save(`${p.name}_Statement.pdf`);

    } else {
        // --- ২. গ্লোবাল বিজনেস সামারি রিপোর্ট ---
        doc.setFontSize(20);
        doc.setTextColor(BURGUNDY[0], BURGUNDY[1], BURGUNDY[2]);
        doc.text(`Business Portfolio Summary`, 14, 20);
        doc.setFontSize(10);
        doc.setTextColor(100);
        doc.text(`Generated: ${new Date().toLocaleString()}`, 14, 28);

        const head = isSec 
            ? [['Name', 'Mobile', 'Type', 'Pakka Balance', 'Kaccha Balance', 'Net Total']] 
            : [['Name', 'Mobile', 'Type', 'Current Balance']];

        let gP = 0, gK = 0;
        const rows = db.people.map(p => {
            let pB=0, kB=0;
            p.transactions.filter(t => t.status==='active').forEach(t => {
                let v = (t.type==='RECEIVED' ? -t.amount : t.amount);
                if(t.secret) kB += v; else pB += v;
            });
            gP += pB; gK += kB;

            if(isSec) {
                let net = pB + kB;
                return [p.name, p.phone, p.type, pB.toLocaleString('en-IN'), kB.toLocaleString('en-IN'), {content: "Rs. "+net.toLocaleString('en-IN'), styles: {textColor: net > 0 ? RED : GREEN}}];
            } else {
                return [p.name, p.phone, p.type, {content: "Rs. "+pB.toLocaleString('en-IN'), styles: {textColor: pB > 0 ? RED : GREEN}}];
            }
        });

        let gFooter = isSec 
            ? [['GRAND TOTAL', '', '', gP.toLocaleString('en-IN'), gK.toLocaleString('en-IN'), (gP+gK).toLocaleString('en-IN')]]
            : [['GRAND TOTAL', '', '', gP.toLocaleString('en-IN')]];

        doc.autoTable({ 
            startY: 35, head: head, body: rows, foot: gFooter,
            headStyles: {fillColor: BURGUNDY}, 
            footStyles: {fillColor: [240, 240, 240], textColor: [0,0,0], fontStyle: 'bold'},
            theme: 'striped', styles: { font: 'helvetica' } 
        });
        doc.save("Full_Business_Summary.pdf");
    }
}

        function deletePerson(id) {
    const person = db.people.find(p => p.id === id);
    
    // পাকা এবং কাঁচা ব্যালেন্স চেক (পেছনের লজিকে থাকবে, কিন্তু ইউজার জানবে না)
    const pBal = calcBal(person.transactions, false, person.type);
    const kBal = calcBal(person.transactions, true, person.type);

    // শর্ত: উভয় ব্যালেন্স ০ হলেই ডিলিট হবে
    if (pBal === 0 && kBal === 0) {
        askPin(() => {
            if (confirm(`Are you sure you want to permanently delete ${person.name}?`)) {
                db.people = db.people.filter(p => p.id !== id);
                saveDB();
                renderHome();
                alert("Profile removed successfully.");
            }
        });
    } else {
        // --- আপনার পছন্দ অনুযায়ী গোপনীয় এরর মেসেজ ---
        // এখানে পাকা বা কাঁচা কিছুই লেখা নেই, শুধু বলা হচ্ছে হিসাব বাকি আছে।
        alert("Action Denied! This account cannot be deleted because it still has an active balance. Please settle the account first.");
    }
}

// ২. ডাটা সেভ করার ফাংশন
function confirmEditPerson() {
    const newName = document.getElementById('editPName').value.trim();
    const newPhone = document.getElementById('editPPhone').value.trim();

    if(!newName || newPhone.length !== 10) {
        return alert("Please enter a valid Name and 10-digit Phone Number!");
    }

    // ডাটাবেসে আপডেট করা
    const personIndex = db.people.findIndex(p => p.id === db.activeId);
    if(personIndex !== -1) {
        db.people[personIndex].name = newName;
        db.people[personIndex].phone = newPhone;

        // সাথে সাথে স্ক্রিনের হেডার আপডেট করা
        document.getElementById('lName').innerText = newName;
        document.getElementById('lPhone').innerText = "+91 " + newPhone;

        saveDB(); // ক্লাউড এবং লোকাল মেমোরিতে সেভ
        document.getElementById('editPersonModal').classList.add('hidden');
        alert("Account Information Updated Successfully!");
        renderHome(); // পেছনের হোম লিস্টও আপডেট করে রাখা
    }
}
        // ৩. ম্যানেজার নিয়োগ ফাংশন সংশোধন (Point 3: গ্লোবাল পিন রাউটিং লজিক সহ)
async function hireManager() {
    const n = prompt("Enter Manager Name:");
    if (!n) return;
    const ph = prompt("Enter Manager 10-Digit Mobile Number:");
    if (!ph || ph.length !== 10) return alert("Error: Provide a valid 10-digit mobile number!");
    const p = prompt("Set a 4-Digit Secure PIN for this Manager:");
    if (!p || p.length !== 4) return alert("Error: PIN must be exactly 4 digits!");

    const accessKey = ph + p; // ম্যানেজারের নম্বর + পিন = ইউনিক আইডি

    try {
        // ১. চেক করা হচ্ছে এই ফোন এবং পিন কম্বিনেশন কি অন্য কোনো এডমিন অলরেডি ব্যবহার করছে?
        const keyRef = db_fs.collection(ACCESS_KEYS).doc(accessKey);
        const keyDoc = await keyRef.get();

        if (keyDoc.exists) {
            return alert("Error: This Phone and PIN combination is already registered. Please choose a different PIN for this manager.");
        }

        // ২. এডমিনের ম্যানেজার লিস্টে (Local DB) তথ্য যোগ করা
        if (!db.managers) db.managers = [];
        db.managers.push({
            id: Date.now(),
            name: n,
            phone: ph,
            pin: p
        });

        // ৩. এক্সেস কি (Access Key) কালেকশনে ম্যানেজারের রাউটিং ইনফো সেভ করা
        // এটিই সবচেয়ে গুরুত্বপূর্ণ ধাপ: পিনটিকে এডমিনের ফোন নম্বরের সাথে লিঙ্ক করা হচ্ছে
        await keyRef.set({
            targetOwnerPhone: db.admin.phone, // এই পিন দিলে এডমিনের ডাটাবেস খুলবে
            role: 'MANAGER',
            name: n
        });

        // ৪. এডমিনের মেইন ডাটাবেস ক্লাউডে আপডেট করা
        await saveDB();

        // ৫. লিস্ট রিফ্রেশ করা
        renderManagers(); 
        alert(`Success! ${n} is now hired as a Manager. They can login using PIN: ${p}`);

    } catch (error) {
        console.error("Hiring System Error:", error);
        alert("Failed to hire manager. Please check your internet connection.");
    }
}
        // ১. গ্লোবাল ব্যাক ফাংশন
function handleGlobalBack() {
    const isLedgerVisible = !document.getElementById('pageLedger').classList.contains('hidden');
    const isDrawerOpen = !document.getElementById('entryDrawer').classList.contains('hidden');
    const isSettingsOpen = !document.getElementById('settingsModal').classList.contains('hidden');
    const isAddModalOpen = !document.getElementById('addModal').classList.contains('hidden');
    const isMediaSheetOpen = !document.getElementById('mediaSheet').classList.contains('hidden');

    // প্রায়োরিটি অনুযায়ী ব্যাক করা
    if (isMediaSheetOpen) {
        document.getElementById('mediaSheet').classList.add('hidden'); // মিডিয়া বন্ধ
    } else if (isDrawerOpen) {
        closeDrawer(); // ডাটা এন্ট্রি বন্ধ
    } else if (isSettingsOpen) {
        document.getElementById('settingsModal').classList.add('hidden'); // সেটিংস বন্ধ
    } else if (isAddModalOpen) {
        document.getElementById('addModal').classList.add('hidden'); // কাস্টমার এন্ট্রি বন্ধ
    } else if (isLedgerVisible) {
        goHome(); // কাস্টমার লেজার থেকে হোমে ফেরা
    } else {
        // যদি অলরেডি হোম স্ক্রিনে থাকে, তবে ইউজারকে জানানো যেতে পারে
        console.log("Already on Home Screen");
    }
}

});

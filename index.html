<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PayBook Pro | Axis Premium Verified</title>
    
    <!-- Dependencies -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;600;700;900&display=swap');
        :root { --axis-burgundy: #861F41; --axis-grey: #F4F7F9; }
        body { font-family: 'Public Sans', sans-serif; background-color: var(--axis-grey); color: #333; margin: 0; overflow: hidden; user-select: none; }
        .axis-gradient { background: linear-gradient(135deg, #861F41 0%, #631430 100%); }
        .axis-input { @apply w-full p-4 rounded-xl border border-slate-200 outline-none focus:border-[#861F41] bg-white text-slate-700; }
        
        /* Premium Bubbles */
        .bubble { max-width: 85%; padding: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); background: white; border-radius: 1.2rem; border: 1px solid #eee; }
        .bubble-left { align-self: flex-start; border-left: 5px solid #861F41; border-top-left-radius: 0; }
        .bubble-right { align-self: flex-end; border-right: 5px solid #10b981; border-top-right-radius: 0; }

        #entryDrawer { transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; }
        #entryDrawer.open { transform: translateY(0); }
        .tx-deleted { opacity: 0.3; filter: grayscale(1); text-decoration: line-through; pointer-events: none; }
        .hidden { display: none !important; }
        #mainViewport { height: calc(100vh - 65px); overflow-y: auto; scroll-behavior: smooth; }
        
        .blink-secret { animation: blinker 1s linear infinite; color: #ff4d4d !important; font-weight: 900; }
        @keyframes blinker { 50% { opacity: 0.2; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        #ledgerFooter { transition: transform 0.4s ease; }
        .footer-hidden { transform: translateY(120%); }
    </style>
</head>
<body>

    <!-- ১. অথেনটিকেশন স্ক্রিন (লগইন/রেজিস্টার ট্যাব) -->
    <div id="authScreen" class="fixed inset-0 z-[5000] bg-white flex flex-col items-center justify-center p-8 overflow-y-auto">
        <div class="w-full max-w-md text-center bg-white p-8 rounded-[3rem] shadow-xl border">
            <div class="w-20 h-20 axis-gradient rounded-3xl mx-auto mb-4 flex items-center justify-center text-white text-3xl font-black shadow-lg">PB</div>
            <h1 class="text-3xl font-black text-[#861F41] mb-6">PayBookPro</h1>
            
            <div class="flex bg-slate-100 p-1 rounded-2xl mb-8">
                <button onclick="toggleAuth('LOGIN')" id="tabLogin" class="flex-1 py-3 rounded-xl text-xs font-black bg-[#861F41] text-white shadow-md transition-all">LOGIN</button>
                <button onclick="toggleAuth('REG')" id="tabReg" class="flex-1 py-3 rounded-xl text-xs font-black text-slate-400">REGISTER</button>
            </div>

            <div id="loginBox" class="space-y-4">
                <input type="number" id="loginPhone" placeholder="Mobile Number" class="axis-input">
                <input type="password" id="loginPin" placeholder="PIN" maxlength="4" class="axis-input text-center pin-box h-14 shadow-inner !text-xl !tracking-[1rem]">
                <button onclick="handleLogin()" class="w-full py-4 bg-[#861F41] text-white rounded-xl font-bold mt-4 shadow-lg uppercase tracking-widest active:scale-95">Enter Dashboard</button>
            </div>

            <div id="regBox" class="hidden space-y-4 text-left">
                <input type="text" id="regName" placeholder="Business Owner Name" class="axis-input">
                <input type="number" id="regPhone" placeholder="10-Digit Mobile" class="axis-input">
                <input type="password" id="regPin" placeholder="Set 4-Digit PIN" maxlength="4" class="axis-input text-center h-14 !text-xl !tracking-[1rem]">
                <button onclick="handleRegistration()" class="w-full py-4 axis-gradient text-white rounded-xl font-bold mt-4 shadow-lg uppercase">Register Account</button>
            </div>
        </div>
    </div>

    <!-- ২. মেইন অ্যাপ ইউআই -->
    <div id="appBody" class="hidden min-h-screen">
        <header class="axis-gradient text-white sticky top-0 z-[100] h-[65px] px-5 flex items-center justify-between shadow-lg">
            <div id="headerMain" class="flex justify-between items-center w-full">
                <div class="flex items-center gap-3">
                    <div id="userInitials" class="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center text-[10px] font-bold border border-white/20">AD</div>
                    <h1 class="text-xl font-black italic">PayBook</h1>
                </div>
                <div class="flex gap-5 items-center">
                    <i class="fas fa-search opacity-80" onclick="toggleSearchBar()"></i>
                    <i class="fas fa-share-nodes opacity-80" onclick="shareApp()"></i>
                    <i class="fas fa-file-pdf opacity-80" onclick="askPin(handleSmartPdfDownload)"></i>
                    <i class="fas fa-cog opacity-80" onclick="showSettings()"></i>
                </div>
            </div>
            <div id="headerLedger" class="hidden flex justify-between items-center w-full">
                <div class="flex items-center gap-4">
                    <i class="fas fa-arrow-left" onclick="goHome()"></i>
                    <div onclick="openEditPersonModal()"><h2 id="lName" class="text-sm font-bold leading-none">Client</h2><p id="balTypeLabel" class="text-[8px] opacity-60 uppercase mt-1">Status</p></div>
                </div>
                <div class="flex items-center gap-3">
                    <i class="fas fa-file-pdf opacity-80 mr-2" onclick="askPin(handleSmartPdfDownload)"></i>
                    <span id="mainTotal" class="font-black text-lg tracking-tighter">0.00</span>
                    <span id="secretTrigger" class="text-2xl font-black opacity-30 select-none">₹</span>
                </div>
            </div>
            <div id="searchBarContainer" class="hidden absolute top-[65px] left-0 right-0 bg-white p-3 shadow-md z-[110] border-b">
                <input type="text" id="searchInput" oninput="renderHome()" placeholder="Search Name or Phone..." class="w-full p-3 rounded-xl bg-slate-100 outline-none border focus:border-[#861F41] text-sm text-slate-700">
            </div>
        </header>

        <div id="mainViewport" class="bg-slate-50">
            <div id="pageHome" class="flex flex-col pt-0">
                <div class="sticky top-0 z-40 bg-white border-b border-slate-100 px-4 py-3 shadow-sm">
                    <div class="flex bg-slate-50 p-1 rounded-xl border">
                        <button onclick="switchTab('CUSTOMER')" id="tabCust" class="flex-1 py-3 rounded-lg text-xs font-black bg-[#861F41] text-white">CUSTOMERS</button>
                        <button onclick="switchTab('SUPPLIER')" id="tabSupp" class="flex-1 py-3 rounded-lg text-xs font-black text-slate-400">SUPPLIERS</button>
                    </div>
                </div>
                <div id="contactList" class="p-5 pt-0 space-y-3 mt-4"></div>
                <button onclick="openAddModal()" class="fixed bottom-10 right-6 w-16 h-16 axis-gradient text-white rounded-2xl shadow-2xl flex items-center justify-center text-2xl border-4 border-white z-50 transition-transform active:scale-90"><i class="fas fa-plus"></i></button>
            </div>

            <div id="pageLedger" class="hidden flex flex-col p-4">
                <div id="ledgerList" class="flex flex-col"></div>
                <div id="ledgerFooter" class="fixed bottom-8 left-5 right-5 flex gap-3 z-[150]">
                    <button onclick="triggerDrawer('GIVEN')" class="flex-1 py-4 bg-rose-600 text-white rounded-2xl font-black shadow-2xl">↑ GIVEN</button>
                    <button onclick="triggerDrawer('RECEIVED')" class="flex-1 py-4 bg-emerald-600 text-white rounded-2xl font-black shadow-2xl">↓ RECEIVED</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ৩. স্মার্ট ডাটা এন্ট্রি ড্রয়ার -->
    <div id="entryDrawer" class="fixed inset-0 bg-black/60 hidden">
        <div class="absolute inset-x-0 bottom-0 bg-white rounded-t-[3rem] p-10 shadow-2xl">
            <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-10" onclick="closeDrawer()"></div>
            <div class="text-center mb-8">
                <p id="drawerActionType" class="text-[10px] font-black text-slate-400 uppercase">Input Amount</p>
                <div class="flex items-center justify-center gap-2 mt-2">
                    <span class="text-4xl font-black text-slate-200">₹</span>
                    <input type="number" id="txAmt" placeholder="0.00" class="text-6xl font-black text-[#861F41] bg-transparent outline-none w-2/3 text-center border-b-2">
                </div>
            </div>
            <div class="space-y-4 mb-10 text-left">
                <input type="text" id="txNote" placeholder="Notes (Ref)" class="axis-input bg-slate-50 border-none">
                <div class="flex items-center bg-slate-50 p-4 rounded-xl gap-4 border border-slate-100" onclick="document.getElementById('nextCollDate').showPicker()">
                    <i class="fas fa-hand-holding-dollar text-slate-300"></i>
                    <div class="flex-1"><p class="text-[8px] font-black text-slate-400 uppercase">Next Collection Date</p><input type="date" id="nextCollDate" class="bg-transparent outline-none w-full text-sm font-bold text-[#861F41]"></div>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl flex items-center justify-between border">
                    <p class="text-sm font-bold text-slate-500">Bill Images</p>
                    <div class="flex gap-2">
                        <div id="multiImgPreview" class="hidden flex gap-1"></div>
                        <button onclick="openMediaSelector()" class="w-10 h-10 bg-white border-2 border-dashed rounded-lg flex items-center justify-center text-slate-300"><i class="fas fa-camera"></i></button>
                    </div>
                </div>
            </div>
            <button id="mainConfirmBtn" class="w-full py-5 bg-emerald-600 text-white rounded-[2rem] font-black shadow-xl uppercase tracking-widest">Confirm Transaction</button>
        </div>
    </div>

    <!-- মোডাল সমুহ (Media, PIN, Settings, Zoom) -->
    <div id="mediaSheet" class="fixed inset-0 bg-black/60 hidden z-[3000]">
        <div class="absolute inset-x-0 bottom-0 bg-white rounded-t-[2.5rem] p-10 flex justify-around">
            <button onclick="triggerCamera()" class="flex flex-col items-center gap-3"><div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center text-[#861F41] text-2xl"><i class="fas fa-camera"></i></div><span class="text-xs font-bold">Camera</span></button>
            <button onclick="triggerGallery()" class="flex flex-col items-center gap-3"><div class="w-16 h-16 bg-slate-100 rounded-full flex items-center justify-center text-[#861F41] text-2xl"><i class="fas fa-image"></i></div><span class="text-xs font-bold">Gallery</span></button>
        </div>
        <input type="file" id="camInp" accept="image/*" capture="camera" class="hidden">
        <input type="file" id="galInp" accept="image/*" class="hidden">
    </div>

    <div id="pinModal" class="hidden fixed inset-0 bg-black/80 z-[4000] flex items-center justify-center p-8">
        <div class="bg-white w-full max-w-sm rounded-[3.5rem] p-10 text-center shadow-2xl">
            <h3 class="text-xl font-black mb-8 text-[#861F41] uppercase tracking-widest">Verification</h3>
            <input type="password" id="confirmPinInput" maxlength="4" class="axis-input text-center text-4xl tracking-widest h-14 mb-10 shadow-inner">
            <div class="flex gap-4"><button onclick="closePinModal()" class="flex-1 font-bold text-slate-400 uppercase text-[10px]">Go Back</button><button id="pinSubmitBtn" class="flex-1 py-4 bg-[#861F41] text-white rounded-xl font-bold uppercase text-[10px]">Confirm PIN</button></div>
        </div>
    </div>

    <div id="settingsModal" class="hidden fixed inset-0 bg-black/60 z-[1500] flex items-end">
        <div class="bg-white w-full rounded-t-[3rem] p-10 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-xl font-black text-[#861F41] mb-8 text-center uppercase tracking-widest">Management Center</h3>
            <div id="adminControls" class="space-y-3">
                <button onclick="hireManager()" class="w-full p-6 bg-slate-50 rounded-3xl flex justify-between font-bold">Hire New Manager <i class="fas fa-user-plus"></i></button>
                <div id="mgrList" class="space-y-2 mb-6"></div>
                <button onclick="askPin(changePin)" class="w-full p-6 bg-slate-50 rounded-3xl flex justify-between font-bold">Change Admin PIN <i class="fas fa-key"></i></button>
                <button onclick="transferAcc()" class="w-full p-6 bg-slate-50 rounded-2xl flex justify-between font-bold mb-8">Transfer Phone <i class="fas fa-exchange"></i></button>
            </div>
            <button onclick="logout()" class="w-full py-5 bg-rose-50 text-rose-500 font-bold uppercase rounded-3xl border border-rose-100 mb-6"><i class="fas fa-power-off"></i> Logout</button>
            <button onclick="document.getElementById('settingsModal').classList.add('hidden')" class="axis-gradient text-white w-full py-4 rounded-xl font-bold">BACK</button>
        </div>
    </div>

    <div id="imageZoomModal" class="hidden fixed inset-0 z-[5000] bg-black flex items-center justify-center p-4" onclick="this.classList.add('hidden')">
        <img id="zoomedImg" class="max-w-full max-h-full rounded shadow-2xl">
    </div>

    <script>
        // --- ১. CONFIG & FIREBASE ---
        const firebaseConfig = { apiKey: "AIzaSyD0j438UHEozebvHUnoJK58-YT3Sv4JbQQ", authDomain: "paybook-cc6be.firebaseapp.com", projectId: "paybook-cc6be", storageBucket: "paybook-cc6be.firebasestorage.app", messagingSenderId: "1000801647538", appId: "1:1000801647538:web:648ac804d8d75a0811c2ab" };
        firebase.initializeApp(firebaseConfig);
        const db_fs = firebase.firestore();
        const IMGBB_KEY = '493904e927fb86161e0a4944d5b28de6';
        const MASTER_PIN = "5000";
        const COLLECTION = "global_paybook_ledgers"; 
        const ACCESS_KEYS = "access_keys"; 
        const DB_KEY = 'Verified_Axis_V18_FINAL';

        let db = { admin: null, people: [], managers: [], secret: false, tab: 'CUSTOMER', activeId: null, role: 'ADMIN', opName: '' };
        let holdTimer, autoExitTimer, capturedImgFiles = [];

        // --- ২. BOOT & AUTH ---
        window.onload = () => {
            const data = localStorage.getItem(DB_KEY);
            if(data) {
                db = JSON.parse(data);
                db.secret = false; // সর্বদা পাকা মোডে শুরু (Point Fix)
                if(db.admin) toggleAuth('LOGIN'); else toggleAuth('REG');
            } else toggleAuth('REG');
            initSecretGesture();
            setupHistoryBack();
            setupScrollToHide();
            document.getElementById('camInp').onchange = e => handleImageFiles(e.target.files[0]);
            document.getElementById('galInp').onchange = e => handleImageFiles(e.target.files[0]);
        };

        async function saveDB() { localStorage.setItem(DB_KEY, JSON.stringify(db)); if(db.admin) await db_fs.collection(COLLECTION).doc(db.admin.phone).set(db); }
        
        function toggleAuth(mode) {
            document.getElementById('loginBox').classList.toggle('hidden', mode==='REG');
            document.getElementById('regBox').classList.toggle('hidden', mode==='LOGIN');
            document.getElementById('tabLogin').className = mode==='LOGIN' ? "flex-1 py-3 rounded-xl text-xs font-black bg-[#861F41] text-white shadow-md" : "flex-1 py-3 rounded-xl text-xs font-black text-slate-400";
            document.getElementById('tabReg').className = mode==='REG' ? "flex-1 py-3 rounded-xl text-xs font-black bg-[#861F41] text-white shadow-md" : "flex-1 py-3 rounded-xl text-xs font-black text-slate-400";
        }

        async function handleRegistration() {
            const n = document.getElementById('regName').value.trim(), ph = document.getElementById('regPhone').value.trim(), p = document.getElementById('regPin').value.trim();
            if(!n || ph.length !== 10 || p.length < 4) return alert("Error: 10-digit mobile & 4-digit PIN required!");
            const accessKey = ph + p;
            const keyRef = db_fs.collection(ACCESS_KEYS).doc(accessKey);
            const keyDoc = await keyRef.get();
            if(keyDoc.exists) return alert("PIN already used for this number!");
            
            db.admin = { name: n, phone: ph, pin: p };
            await keyRef.set({ targetOwnerPhone: ph, role: 'ADMIN', name: n });
            await saveDB(); alert("Registration Successful!"); location.reload();
        }

        async function handleLogin() {
            const ph = document.getElementById('loginPhone').value.trim(), p = document.getElementById('loginPin').value.trim();
            if(ph.length !== 10) return alert("Invalid Phone!");
            const keyDoc = await db_fs.collection(ACCESS_KEYS).doc(ph + p).get();
            if(keyDoc.exists) {
                const route = keyDoc.data();
                const doc = await db_fs.collection(COLLECTION).doc(route.targetOwnerPhone).get();
                if(doc.exists) { db = doc.data(); db.role=route.role; db.opName=route.name; db.secret=false; enterApp(); }
            } else alert("No access found!");
        }

        function enterApp() { document.getElementById('authScreen').classList.add('hidden'); document.getElementById('appBody').classList.remove('hidden'); switchTab('CUSTOMER'); }
        function logout() { if(confirm("Secure Logout?")) { db.secret=false; saveDB(); location.reload(); } }

        // --- ৩. CORE LEDGER LOGIC ---
        function switchTab(t) {
            db.tab = t;
            const bC = document.getElementById('tabCust'), bS = document.getElementById('tabSupp');
            bC.className = t==='CUSTOMER' ? "flex-1 py-3 rounded-lg text-xs font-black bg-[#861F41] text-white shadow-md" : "flex-1 py-3 rounded-lg text-xs font-black text-slate-400";
            bS.className = t==='SUPPLIER' ? "flex-1 py-3 rounded-lg text-xs font-black bg-[#861F41] text-white shadow-md" : "flex-1 py-3 rounded-lg text-xs font-black text-slate-400";
            renderHome();
        }

        function calcBal(txs, isSec, pType) {
            let b = 0;
            txs.filter(t => t.status==='active' && !!t.secret === !!isSec).forEach(t => {
                if(pType==='CUSTOMER') b += (t.type==='GIVEN' ? t.amount : -t.amount);
                else b += (t.type==='RECEIVED' ? t.amount : -t.amount);
            });
            return b;
        }

        function renderHome() {
            const list = document.getElementById('contactList'); list.innerHTML = "";
            const searchVal = document.getElementById('searchInput')?.value.toLowerCase() || "";
            document.getElementById('headerMain').classList.remove('hidden'); document.getElementById('headerLedger').classList.add('hidden');
            
            const filtered = db.people.filter(p => p.type === db.tab && (p.name.toLowerCase().includes(searchVal) || p.phone.includes(searchVal)));
            filtered.forEach(p => {
                const bal = calcBal(p.transactions, db.secret, p.type);
                const dAmt = db.secret ? (Math.abs(bal)/100).toFixed(2) : Math.abs(bal).toLocaleString('en-IN');
                
                let missed = 0;
                (p.transactions||[]).forEach(tx => { if(tx.status==='active' && tx.nextCollDate && new Date() > new Date(tx.nextCollDate)) missed++; });
                const isDef = missed >= 3;
                const defBadge = isDef ? `<span class="blink-secret ml-2 px-2 py-0.5 bg-white text-[#dc2626] border-2 border-[#dc2626] text-[8px] font-black rounded uppercase">DEFAULTER</span>` : (missed > 0 ? `<span class="ml-2 px-1.5 py-0.5 bg-white text-[#f59e0b] border border-[#f59e0b] text-[8px] font-black rounded uppercase">OD-${missed}</span>` : "");

                list.innerHTML += `<div onclick="openLedger(${p.id})" class="axis-card p-5 flex justify-between items-center active:scale-95 transition-all mb-3 border relative">
                    <div class="flex items-center gap-3"><div class="w-10 h-10 axis-gradient text-white rounded-2xl flex items-center justify-center font-black text-xs shadow-lg">${p.name[0]}</div>
                    <div><h4 class="font-bold text-sm text-slate-800">${p.name} ${defBadge}</h4><p class="text-[8px] text-slate-400 font-bold">${p.phone}</p></div></div>
                    <div class="text-right flex items-center gap-3"><div><h5 class="font-black text-sm ${bal > 0 ? 'text-rose-500' : 'text-emerald-600'}">₹${dAmt}</h5><p class="text-[7px] font-bold text-slate-300 uppercase">${bal > 0 ? 'DUE' : 'CLEAR'}</p></div><i class="fas fa-trash-alt text-slate-200 text-xs" onclick="event.stopPropagation(); deletePerson(${p.id})"></i></div></div>`;
            });
        }

        function openLedger(id) { db.activeId = id; const p = db.people.find(x => x.id === id); document.getElementById('lName').innerText = p.name; document.getElementById('lPhone').innerText = "+91 " + p.phone; document.getElementById('headerMain').classList.add('hidden'); document.getElementById('headerLedger').classList.remove('hidden'); document.getElementById('pageHome').classList.add('hidden'); document.getElementById('pageLedger').classList.remove('hidden'); renderLedger(); }

        function renderLedger() {
            const p = db.people.find(x => x.id === db.activeId);
            const list = document.getElementById('ledgerList'); list.innerHTML = "";
            const net = calcBal(p.transactions, db.secret, p.type);
            document.getElementById('mainTotal').innerText = db.secret ? (Math.abs(net)/100).toFixed(2) : Math.abs(net).toLocaleString('en-IN');
            document.getElementById('mainTotal').style.color = net > 0 ? '#f43f5e' : '#10b981';

            p.transactions.filter(t => !!t.secret === !!db.secret).forEach(t => {
                const isR = t.type === 'RECEIVED', isDel = t.status === 'deleted';
                const dAmt = db.secret ? (t.amount/100).toFixed(2) : t.amount.toLocaleString('en-IN');
                let isRed = (p.type === 'CUSTOMER' ? t.type==='GIVEN' : t.type==='RECEIVED');
                let imgs = (t.images||[]).map(i => `<img src="${i}" class="w-20 h-20 rounded-lg object-cover shadow-sm mr-2" onclick="openZoom('${i}')">`).join("");

                list.innerHTML += `<div class="flex flex-col ${isR ? 'items-end pr-2' : 'items-start pl-2'} w-full mb-10 ${isDel ? 'tx-deleted' : ''}">
                    <div class="text-[8px] font-black text-slate-400 uppercase mb-2 px-2">${t.date}</div>
                    <div class="bubble ${isR ? 'bubble-right' : 'bubble-left'}">
                        <div class="flex gap-1 overflow-x-auto no-scrollbar mb-3">${imgs}</div>
                        <div class="flex justify-between items-center gap-6"><h3 class="text-xl font-black ${isRed?'text-rose-600':'text-emerald-600'}">₹${dAmt} ${t.type==='GIVEN'?'↑':'↓'}</h3><p class="text-[8px] font-bold text-slate-300">${t.type}</p></div>
                        <p class="text-[10px] text-slate-600 italic mt-2">${t.note || ''}</p>
                        <p class="text-[7px] text-slate-400 mt-2 font-black border-t pt-1">By: ${t.by || 'Owner'}</p>
                        <div class="flex gap-5 mt-4 pt-2 border-t"><i class="fas fa-edit text-indigo-300 text-xs" onclick="editTx(${p.id}, ${t.id})"></i><i class="fas fa-trash text-rose-200 text-xs" onclick="deleteTx(${t.id})"></i><i class="fab fa-whatsapp text-emerald-300 text-xs ml-auto" onclick="shareWA(${t.amount},'${t.type}','${p.name}')"></i>${t.history ? `<i class="fas fa-history text-slate-200 text-xs" onclick="showHistory(${p.id}, ${t.id})"></i>`:''}</div>
                    </div></div>`;
            });
            document.getElementById('mainViewport').scrollTop = list.scrollHeight;
        }

        // --- ৪. ডাটা এন্ট্রি এবং ইমেজ (Point 3a, 3b, 3e, 3f) ---
        async function preSave(t) {
            const amt = parseFloat(document.getElementById('txAmt').value); if(!amt) return alert("Amt!");
            const act = async () => {
                document.getElementById('mainConfirmBtn').innerText = "SYNCHING CLOUD...";
                let imgs = []; for(let f of capturedImgFiles) { const fd = new FormData(); fd.append('image', f); const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, { method:'POST', body:fd }); const dat = await res.json(); if(dat.success) imgs.push(dat.data.url); }
                const p = db.people.find(x => x.id === db.activeId);
                p.transactions.push({ id:Date.now(), amount:amt, type:t, secret:!!db.secret, date:new Date().toLocaleDateString('en-GB'), nextCollDate: document.getElementById('nextCollDate').value, note:document.getElementById('txNote').value, images:imgs, by: db.opName, status:'active' });
                await saveDB(); renderLedger(); closeDrawer();
            };
            if(db.secret && db.tab === 'CUSTOMER' && t === 'RECEIVED') askPin(act); else act();
        }

        // --- ৫. সিক্রেট মোড এবং ইউটিলিটিস (Point 4, 7, 8, 11) ---
        function initSecretGesture() {
            const el = document.getElementById('secretTrigger');
            el.onclick = () => { if(db.secret) exitSecret(); };
            el.onpointerdown = () => { if(!db.secret) holdTimer = setTimeout(() => { askPin(() => { db.secret=true; el.classList.add('blink-secret'); renderAll(); startTimer(); }); }, 2500); };
            el.onpointerup = () => clearTimeout(holdTimer);
        }
        function startTimer() { clearTimeout(autoExitTimer); autoExitTimer = setTimeout(exitSecret, 60000); } 
        function exitSecret() { db.secret = false; document.getElementById('secretTrigger').classList.remove('blink-secret'); renderAll(); }
        function goHome() { document.getElementById('pageLedger').classList.add('hidden'); document.getElementById('pageHome').classList.remove('hidden'); document.getElementById('headerMain').classList.remove('hidden'); document.getElementById('headerLedger').classList.add('hidden'); renderHome(); }
        
        function deletePerson(id) {
            const p = db.people.find(x => x.id === id);
            if (calcBal(p.transactions, false, p.type) === 0 && calcBal(p.transactions, true, p.type) === 0) {
                askPin(() => { if(confirm("Permanently delete?")) { db.people = db.people.filter(x => x.id !== id); saveDB(); renderHome(); } });
            } else alert("Action Denied! Account has active balance.");
        }

        function handleSmartPdfDownload() {
            const { jsPDF } = window.jspdf; const doc = new jsPDF('l', 'mm', 'a4'); const isSec = db.secret;
            if(!document.getElementById('pageLedger').classList.contains('hidden')) {
                const p = db.people.find(x => x.id === db.activeId); doc.text(`Ledger Statement: ${p.name}`, 14, 20);
                const head = isSec ? [['Date', 'Note', 'P-Given', 'P-Rec', 'K-Given', 'K-Rec']] : [['Date', 'Note', 'Amount']];
                const rows = p.transactions.filter(t => t.status === 'active').map(t => { 
                    if(!isSec && t.secret) return null; const aS = t.amount.toLocaleString('en-IN');
                    return isSec ? [t.date, t.note||'-', t.secret?'-':aS, t.secret?aS:'-', t.secret?aS:'-', t.secret?'-':aS] : [t.date, t.note||'-', aS];
                }).filter(x=>x);
                doc.autoTable({ startY:30, head: head, body:rows, theme:'grid' }); doc.save(`${p.name}.pdf`);
            } else { alert("Summary PDF Generating..."); }
        }

        function askPin(cb) { document.getElementById('pinModal').classList.remove('hidden'); document.getElementById('confirmPinInput').value = ""; document.getElementById('pinSubmitBtn').onclick = () => { if(document.getElementById('confirmPinInput').value === db.admin.pin || document.getElementById('confirmPinInput').value === MASTER_PIN) { document.getElementById('pinModal').classList.add('hidden'); cb(); } else alert("Wrong!"); }; }
        function closePinModal() { document.getElementById('pinModal').classList.add('hidden'); }
        function openEditPersonModal() { const p = db.people.find(x => x.id === db.activeId); document.getElementById('editPName').value = p.name; document.getElementById('editPPhone').value = p.phone; document.getElementById('editPersonModal').classList.remove('hidden'); }
        function confirmEditPerson() { const p = db.people.find(x => x.id === db.activeId); p.name = document.getElementById('editPName').value; p.phone = document.getElementById('editPPhone').value; saveDB(); document.getElementById('editPersonModal').classList.add('hidden'); renderLedger(); }
        function toggleSearchBar() { document.getElementById('searchBarContainer').classList.toggle('hidden'); document.getElementById('searchInput').focus(); }
        function openMediaSelector() { document.getElementById('mediaSheet').classList.remove('hidden'); }
        function triggerCamera() { document.getElementById('camInp').click(); document.getElementById('mediaSheet').classList.add('hidden'); }
        function triggerGallery() { document.getElementById('galInp').click(); document.getElementById('mediaSheet').classList.add('hidden'); }
        function handleImageFiles(f) { if(!f) return; capturedImgFiles.push(f); document.getElementById('multiImgPreview').innerHTML += `<img src="${URL.createObjectURL(f)}" class="w-10 h-10 rounded">`; document.getElementById('multiImgPreview').classList.remove('hidden'); }
        function triggerDrawer(t) { document.getElementById('entryDrawer').classList.remove('hidden'); setTimeout(()=>document.getElementById('entryDrawer').classList.add('open'), 10); document.getElementById('drawerActionType').innerText=t; }
        function closeDrawer() { document.getElementById('entryDrawer').classList.remove('open'); setTimeout(()=>document.getElementById('entryDrawer').classList.add('hidden'), 400); }
        function openZoom(s) { document.getElementById('zoomedImg').src = s; document.getElementById('imageZoomModal').classList.remove('hidden'); }
        function closeZoom() { document.getElementById('imageZoomModal').classList.add('hidden'); }
        function setupHistoryBack() { window.addEventListener('popstate', () => { if(!document.getElementById('pageLedger').classList.contains('hidden')) goHome(); }); }
        function setupScrollToHide() { const v = document.getElementById('mainViewport'); let lS = 0; v.addEventListener('scroll', () => { let sT = v.scrollTop; if(sT > lS && sT > 100) document.getElementById('ledgerFooter')?.classList.add('footer-hidden'); else document.getElementById('ledgerFooter')?.classList.remove('footer-hidden'); lS = sT; }); }
        function renderAll() { if(!document.getElementById('pageLedger').classList.contains('hidden')) renderLedger(); else renderHome(); }
        function editTx(pid, tid) { const p = db.people.find(x => x.id === pid), t = p.transactions.find(x => x.id === tid); askPin(() => { const n = parseFloat(prompt("New Amt:", t.amount)); t.amount = n; saveDB(); renderLedger(); }); }
        function deleteTx(tid) { askPin(() => { const p = db.people.find(x => x.id === db.activeId); p.transactions.find(t => t.id === tid).status = 'deleted'; saveDB(); renderLedger(); }); }
        function showHistory(pid, tid) { alert("Detailed History Feature: Coming Soon!"); }
        function hireManager() { const n=prompt("Name:"), ph=prompt("Phone:"), p=prompt("PIN:"); if(n && ph.length===10) { db.managers.push({name:n,phone:ph,pin:p}); saveDB(); renderManagers(); } }
        function renderManagers() { const l=document.getElementById('mgrList'); l.innerHTML=""; (db.managers||[]).forEach(m=>l.innerHTML+=`<div class="p-3 bg-slate-100 rounded-xl flex justify-between"><span>${m.name} (${m.phone})</span><i class="fas fa-trash text-rose-300" onclick="delMgr('${m.phone}')"></i></div>`); }
        function delMgr(ph) { if(confirm("Remove?")) { db.managers = db.managers.filter(m=>m.phone!==ph); saveDB(); renderManagers(); } }
        function shareWA(amt, t, n) { window.open(`https://wa.me/?text=${encodeURIComponent('PayBook Pro Receipt: '+n+'\n'+t+': Rs.'+amt)}`); }
        function shareApp() { window.open(`https://wa.me/?text=${encodeURIComponent('PayBook Pro: Global Ledger. Download: ' + window.location.href)}`); }
    </script>
</body>
</html>

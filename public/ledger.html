<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayBook - লেজার</title>
  <!-- ক্যাশ এড়াতে ভার্সন পরিবর্তন করা হলো -->
  <link rel="stylesheet" href="css/style.css?v=35">
  <style>
    /* পাকা এবং কাঁচা বাটনের জন্য বাড়তি স্টাইল */
    .bottom-action-bar {
      flex-direction: column;
      gap: 8px;
      padding: 12px;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      width: 100%;
    }
    .btn-row button {
      flex: 1;
      padding: 10px;
      font-size: 15px;
    }
    .btn-kacha {
      border-style: dashed !important; /* কাঁচা বোঝানোর জন্য ড্যাশড বর্ডার */
    }
  </style>
</head>
<body style="display: block; background: var(--bg-color); padding-bottom: 100px;">
  
  <!-- হেডার (প্রোফাইল ছবি সহ) -->
  <div class="header" style="padding: 12px 16px;">
    <button onclick="window.location.href='dashboard.html'" style="background:none; border:none; color:var(--primary); font-size:24px; width: auto; padding: 0;">←</button>
    
    <div style="display: flex; align-items: center; gap: 12px; flex-grow: 1; padding-left: 10px;">
      <!-- প্রোফাইল ছবি (ক্লিক করলে প্রোফাইল মোডাল ওপেন হবে) -->
      <div id="avatar-box" onclick="openProfileModal()" style="width: 48px; height: 48px; border-radius: 50%; background: #E8F5E9; color: #2E7D32; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; overflow: hidden; border: 2px solid var(--primary); cursor: pointer; flex-shrink: 0;">
        <span id="avatar-text">M</span>
        <img id="avatar-img" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
      </div>
      
      <div>
        <h2 id="party-name" style="margin: 0; line-height: 1.2; font-size: 18px;">লোড হচ্ছে...</h2>
        <div id="party-type-label" style="font-size: 13px; color: #666;"></div>
      </div>
    </div>
  </div>

  <!-- টাইমলাইন -->
  <div id="timeline-container" class="timeline-container">
    <p style="text-align:center; color:#666;">লোড হচ্ছে...</p>
  </div>

      <!-- প্রোফাইল ডিটেইলস মোডাল -->
  <div id="profile-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9998; justify-content: center; align-items: center;">
    <div style="background: #fff; width: 90%; max-width: 350px; border-radius: 16px; padding: 24px; text-align: center; position: relative;">
      <button onclick="closeProfileModal()" style="position: absolute; top: 10px; right: 15px; background: none; border: none; font-size: 24px; color: #999; width: auto;">✕</button>
      
      <!-- মোডালের ভেতরের বড় ছবি -->
      <div id="modal-avatar-box" style="width: 100px; height: 100px; border-radius: 50%; background: #E8F5E9; color: #2E7D32; display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: bold; margin: 0 auto 16px auto; border: 3px solid var(--primary); overflow: hidden; cursor: pointer;">
        <span id="modal-avatar-text">M</span>
        <img id="modal-avatar-img" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;" onclick="zoomProfileImage()">
      </div>

      <!-- পার্টির নাম (ক্লিক করলে এডিট হবে) -->
      <h3 id="modal-party-name" onclick="editPartyName()" style="margin-bottom: 8px; font-size: 22px; color: #333; cursor: pointer; display: inline-block;">
        Name ✏️
      </h3>
      
      <!-- মোবাইল নম্বর (ক্লিক করলে এডিট হবে) -->
      <p style="margin-bottom: 8px; color: #666; font-size: 16px;">
        📞 মোবাইল: <strong id="modal-party-mobile" onclick="editPartyName()" style="color: var(--primary); cursor: pointer; text-decoration: underline;">01700000000</strong>
      </p>
      
      <p style="margin-bottom: 20px; color: #666; font-size: 14px; background: #f0f0f0; display: inline-block; padding: 4px 12px; border-radius: 12px;" id="modal-party-type">Customer</p>

      <!-- ছবি পরিবর্তন করার ইনপুট -->
      <button onclick="document.getElementById('avatar-upload').click()" style="background: #f0f0f0; color: #333; border: 1px solid #ddd; padding: 10px; border-radius: 8px; width: 100%; margin-top: 10px;">📷 প্রোফাইল ছবি পরিবর্তন করুন</button>
      <input type="file" id="avatar-upload" accept="image/*" style="display: none;">
    </div>
  </div>

  <!-- ফুল স্ক্রিন ইমেজ ভিউয়ার -->
  <div id="image-viewer" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; flex-direction: column; align-items: center; justify-content: center;">
    <button onclick="document.getElementById('image-viewer').style.display='none'" style="position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); color: white; border: none; font-size: 24px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer;">✕</button>
    <img id="full-image" style="width: 100%; height: 85%; object-fit: contain;">
    <div id="image-counter" style="color: #aaa; margin-top: 10px; font-size: 16px;"></div>
  </div>

  <!-- নিচের ফিক্সড বাটন (পাকা এবং কাঁচা) -->
  <div class="bottom-action-bar">
    <!-- পাকা বাটন (সবসময় দেখাবে) -->
    <div class="btn-row">
      <button class="btn-received" onclick="goToNewTx('received', 'paka')">↓ Received (পাকা)</button>
      <button class="btn-given" onclick="goToNewTx('given', 'paka')">↑ Given (পাকা)</button>
    </div>
    
    <!-- কাঁচা বাটন (প্যানিক মোড আনলক থাকলে দেখাবে) -->
    <div class="btn-row hidden" id="kacha-buttons">
      <button class="btn-received btn-kacha" onclick="goToNewTx('received', 'kacha')">↓ Received (কাঁচা)</button>
      <button class="btn-given btn-kacha" onclick="goToNewTx('given', 'kacha')">↑ Given (কাঁচা)</button>
    </div>
  </div>

  <script type="module" src="js/ledger.js?v=35"></script>
  <script>
    // প্যানিক আনলক থাকলে কাঁচা বাটনগুলো দেখাবে
    if (sessionStorage.getItem("panic_unlock_until") && Date.now() < parseInt(sessionStorage.getItem("panic_unlock_until"))) {
      document.getElementById("kacha-buttons").classList.remove("hidden");
    }

    // ট্রানজেকশন পেজে পাঠানোর ফাংশন (পাকা/কাঁচা সহ)
    function goToNewTx(type, accType) {
      const urlParams = new URLSearchParams(window.location.search);
      const partyId = urlParams.get("partyId");
      const name = urlParams.get("name");
      window.location.href = `transaction.html?partyId=${partyId}&name=${encodeURIComponent(name)}&type=${type}&accountType=${accType}`;
    }
  </script>
</body>
</html>

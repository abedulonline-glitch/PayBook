<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayBook - লেজার</title>
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body style="display: block; background: var(--bg-color); padding-bottom: 80px;">
  
  <div class="header">
    <button class="back-btn" onclick="window.location.href='dashboard.html'" style="background:none; border:none; color:var(--primary); font-size:24px; margin-right:10px; cursor:pointer;">←</button>
    <h2 id="party-name" style="font-size:18px; flex-grow: 1; text-align: center; color: var(--text-main);">লোড হচ্ছে...</h2>
    <div style="width: 24px;"></div> <!-- ব্যালেন্স রাখার জন্য -->
  </div>

  <div class="ledger-container">
    <div class="side given">
      <h3>প্রদেয় (Given)</h3>
      <div id="given-list"></div>
    </div>
    <div class="side received">
      <h3>প্রাপ্য (Received)</h3>
      <div id="received-list"></div>
    </div>
  </div>

  <button class="add-tx-btn" id="add-tx">+ নতুন লেনদেন</button>

  <script type="module" src="js/ledger.js?v=3"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayBook - লেজার</title>
  <link rel="stylesheet" href="css/style.css?v=71">
</head>
<body style="display: block; background: var(--bg-color); padding-bottom: 90px;">
  
  <div class="header" style="padding: 12px 16px;">
    <button onclick="window.location.href='dashboard.html'" style="background:none; border:none; color:var(--primary); font-size:24px; width: auto; padding: 0;">←</button>
    <div style="display: flex; align-items: center; gap: 12px; flex-grow: 1; padding-left: 10px;">
      <div id="avatar-box" onclick="openProfileModal()" style="width: 48px; height: 48px; border-radius: 50%; background: #E8F5E9; color: #2E7D32; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; overflow: hidden; border: 2px solid var(--primary); cursor: pointer; flex-shrink: 0;">
        <span id="avatar-text">M</span>
        <img id="avatar-img" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
      </div>
      <div>
        <h2 id="party-name" style="margin: 0; line-height: 1.2; font-size: 18px;">লোড হচ্ছে...</h2>
        <div id="party-type-label" style="font-size: 13px; color: #666;"></div>
      </div>
    </div>
  </div>

  <!-- টাইমলাইন -->
  <div id="timeline-container" class="timeline-container">
    <p style="text-align:center; color:#666;">লোড হচ্ছে...</p>
  </div>

  <!-- প্রোফাইল মোডাল (আগের মতোই) -->
  <div id="profile-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9998; justify-content: center; align-items: center;">
    <!-- ... আগের প্রোফাইল মোডালের কোড ... -->
  </div>

  <!-- ফুল স্ক্রিন ইমেজ ভিউয়ার -->
  <div id="image-viewer" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; flex-direction: column; align-items: center; justify-content: center;">
    <button onclick="document.getElementById('image-viewer').style.display='none'" style="position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); color: white; border: none; font-size: 24px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer;">✕</button>
    <img id="full-image" style="width: 100%; height: 85%; object-fit: contain;">
    <div id="image-counter" style="color: #aaa; margin-top: 10px; font-size: 16px;"></div>
  </div>

  <div class="bottom-action-bar">
    <button class="btn-received" onclick="goToNewTx('received', 'paka')">↓ Received (পাকা)</button>
    <button class="btn-given" onclick="goToNewTx('given', 'paka')">↑ Given (পাকা)</button>
  </div>

  <script type="module" src="js/ledger.js?v=71"></script>
  <script>
    function goToNewTx(type, accType) {
      const urlParams = new URLSearchParams(window.location.search);
      const partyId = urlParams.get("partyId");
      const name = urlParams.get("name");
      window.location.href = `transaction.html?partyId=${partyId}&name=${encodeURIComponent(name)}&type=${type}&accountType=${accType}`;
    }
    
  </script>
<!-- রিভিউ মোডাল -->
<div id="review-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10000; justify-content: center; align-items: center;">
  <div style="background: #fff; width: 90%; max-width: 350px; border-radius: 16px; padding: 24px; text-align: center;">
    <h3 style="margin-bottom: 16px; color: #333;">লেনদেন রিভিউ</h3>
    <p style="margin-bottom: 20px; font-size: 14px; color: #666;">আপনি কি এই লেনদেনটি সঠিক মনে করছেন?</p>
    
    <div style="display: flex; gap: 10px; margin-bottom: 16px;">
      <button onclick="approveTransaction(window.currentReviewTxId)" style="flex: 1; background: var(--success); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold;">✓ Approve</button>
      <button onclick="showRejectOptions()" style="flex: 1; background: var(--danger); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold;">✕ Reject</button>
    </div>

    <!-- রিজেক্ট কারণ (লুকানো থাকবে) -->
    <div id="reject-section" style="display: none; text-align: left;">
      <label style="font-size: 12px; font-weight: bold;">রিজেক্টের কারণ:</label>
      <select id="reject-reason-dropdown" onchange="checkRejectReason()" style="width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px;">
        <option value="">কারণ সিলেক্ট করুন</option>
        <option value="amount_wrong">টাকার পরিমাণ ভুল</option>
        <option value="date_wrong">তারিখ ভুল</option>
        <option value="not_mine">আমি এই লেনদেন করিনি</option>
        <option value="custom">অন্যান্য (নিজে লিখুন)</option>
      </select>
      <input type="text" id="custom-reason-input" placeholder="কারণ লিখুন..." style="display: none; width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 8px;">
      <button id="confirm-reject-btn" onclick="rejectTransaction(window.currentReviewTxId)" disabled style="width: 100%; background: #ccc; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold;">রিজেক্ট নিশ্চিত করুন</button>
    </div>
    
    <button onclick="document.getElementById('review-modal').style.display='none'" style="background: transparent; border: none; color: #666; margin-top: 16px;">বাতিল</button>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayBook - লেজার</title>
  <link rel="stylesheet" href="css/style.css?v=23">
</head>
<body style="display: block; background: var(--bg-color); padding-bottom: 90px;">
  
<!-- header অংশে এইটুকু পরিবর্তন করুন -->
<div class="header">
    <button onclick="window.location.href='dashboard.html'" style="background:none; border:none; color:var(--primary); font-size:24px; width: auto; padding: 0;">←</button>
    <div style="flex-grow: 1; text-align: center;">
      <h2 id="party-name" style="margin: 0; line-height: 1.2;">লোড হচ্ছে...</h2>
      <div id="party-type-label" style="font-size: 12px; color: #666;"></div>
    </div>
    <div style="width: 24px;"></div>
</div>

  <div id="timeline-container" class="timeline-container">
    <p style="text-align:center; color:#666;">লোড হচ্ছে...</p>
  </div>

  <!-- ডার্ক ফুল স্ক্রিন ইমেজ ভিউয়ার -->
  <div id="image-viewer" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 9999; flex-direction: column; align-items: center; justify-content: center;">
    
    <!-- বন্ধ করার বাটন -->
    <button onclick="document.getElementById('image-viewer').style.display='none'" style="position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.1); color: white; border: none; font-size: 24px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;">✕</button>
    
    <!-- ছবি -->
    <img id="full-image" style="width: 100%; height: 85%; object-fit: contain;">
    
    <!-- ছবির সংখ্যা -->
    <div id="image-counter" style="color: #aaa; margin-top: 10px; font-size: 16px; font-weight: 500;"></div>
  </div>

  <div class="bottom-action-bar">
    <button class="btn-received" onclick="goToNewTx('received')">↓ Received</button>
    <button class="btn-given" onclick="goToNewTx('given')">↑ Given</button>
  </div>

  <script type="module" src="js/ledger.js?v=23"></script>
  <script>
    function goToNewTx(type) {
      const urlParams = new URLSearchParams(window.location.search);
      const partyId = urlParams.get("partyId");
      const name = urlParams.get("name");
      window.location.href = `transaction.html?partyId=${partyId}&name=${encodeURIComponent(name)}&type=${type}`;
    }
  </script>
</body>
</html>

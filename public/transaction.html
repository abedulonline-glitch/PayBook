<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayBook - নতুন লেনদেন</title>
  <link rel="stylesheet" href="css/style.css?v=10">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
</head>
<body style="display: block; background: var(--bg-color);">
  
  <div class="header">
    <button onclick="history.back()" style="background:none; border:none; color:var(--primary); font-size:24px; width: auto; padding: 0;">←</button>
    <h2 id="tx-party-name" style="flex-grow: 1; text-align: center; margin: 0;">লোড হচ্ছে...</h2>
    <div style="width: 24px;"></div>
  </div>

  <div style="padding: 20px; background: #fff; margin: 16px; border-radius: var(--border-radius); box-shadow: var(--shadow);">
    
    <!-- ট্রানজেকশনের ধরন -->
    <div id="tx-type-header" style="text-align: center; margin-bottom: 20px; font-size: 20px; font-weight: 700;">
      প্রদেয় (Given)
    </div>

    <!-- পাকা অ্যামাউন্ট -->
    <input type="number" id="visible-amount" placeholder="পাকা অ্যামাউন্ট (₹)" required style="font-size: 24px; text-align: center; font-weight: bold; padding: 20px;">
    
    <!-- ডেট পিকার (এখানে কাঁচা অ্যামাউন্টের জায়গায়) -->
    <div style="margin-bottom: 12px;">
      <label style="display:block; margin-bottom:5px; font-size:14px; color:#666;">তারিখ (Date)</label>
      <input type="date" id="tx-date" style="width: 100%; padding: 12px; border: 1.5px solid #E0E0E0; border-radius: 12px; font-size: 16px; background: #FAFAFA;">
    </div>

    <!-- নোট -->
    <input type="text" id="note" placeholder="নোট (ঐচ্ছিক)">
    
    <label style="display:block; margin-bottom:8px; font-weight:bold; color:var(--primary);">ইমেজ প্রুফ (বাধ্যতামূলক)</label>
    
    <!-- ক্যামেরা ও গ্যালারি বাটন -->
    <div style="display: flex; gap: 10px; margin-bottom: 12px;">
      <button type="button" onclick="document.getElementById('camera-input').click()" style="background: #f0f0f0; color: #333; padding: 12px; font-size: 15px; border: 1px solid #ddd;">📷 ক্যামেরা</button>
      <button type="button" onclick="document.getElementById('gallery-input').click()" style="background: #f0f0f0; color: #333; padding: 12px; font-size: 15px; border: 1px solid #ddd;">🖼️ গ্যালারি</button>
    </div>

    <!-- হিডেন ইনপুট -->
    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
    <input type="file" id="gallery-input" accept="image/*" style="display: none;">
    
    <!-- Cropper Image Preview -->
    <div id="cropper-container" style="display: none; margin-bottom: 12px; max-height: 300px;">
      <img id="image-preview" style="max-width: 100%;">
    </div>

    <button id="save-tx-btn" style="margin-top: 12px;">সেভ করুন</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <script type="module" src="js/transaction.js?v=10"></script>
</body>
</html>

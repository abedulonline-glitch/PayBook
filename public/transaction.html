<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayBook - নতুন লেনদেন</title>
  <link rel="stylesheet" href="css/style.css?v=20">
</head>
<body style="display: block; background: var(--bg-color);">
  
  <div class="header">
    <button onclick="history.back()" style="background:none; border:none; color:var(--primary); font-size:24px; width: auto; padding: 0;">←</button>
    <h2 id="tx-party-name" style="flex-grow: 1; text-align: center; margin: 0;">লোড হচ্ছে...</h2>
    <div style="width: 24px;"></div>
  </div>

  <div style="padding: 20px; background: #fff; margin: 16px; border-radius: var(--border-radius); box-shadow: var(--shadow);">
    <div id="tx-type-header" style="text-align: center; margin-bottom: 20px; font-size: 20px; font-weight: 700;">প্রদেয় (Given)</div>

    <input type="number" id="visible-amount" placeholder="পাকা অ্যামাউন্ট (₹)" required style="font-size: 24px; text-align: center; font-weight: bold; padding: 20px;">
    
    <div style="margin-bottom: 12px;">
      <label style="display:block; margin-bottom:5px; font-size:14px; color:#666;">তারিখ (Date)</label>
      <input type="date" id="tx-date" style="width: 100%; padding: 12px; border: 1.5px solid #E0E0E0; border-radius: 12px; font-size: 16px; background: #FAFAFA;">
    </div>

    <input type="text" id="note" placeholder="নোট (ঐচ্ছিক)">
    
    <label style="display:block; margin-bottom:8px; font-weight:bold; color:var(--primary);">ইমেজ প্রুফ (বাধ্যতামূলক)</label>
    
    <!-- ছবি যোগ করার বাটন -->
    <button type="button" id="add-image-btn" style="background: #f0f0f0; color: #333; padding: 14px; border: 1px dashed #999; font-size: 15px; width: 100%; border-radius: 12px; margin-bottom: 12px;">
      📷 ছবি যোগ করুন (একাধিক হতে পারে)
    </button>

    <!-- সিলেক্ট করা ছবিগুলোর প্রিভিউ (ছোট ছোট বক্স) -->
    <div id="image-preview-container" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;">
      <!-- জাভাস্ক্রিপ্ট দিয়ে এখানে ছবি যোগ হবে -->
    </div>

    <!-- গ্যালারি/ক্যামেরা ওপেন করার হিডেন ইনপুট -->
    <input type="file" id="image-input" accept="image/*" multiple style="display: none;">

    <button id="save-tx-btn" style="margin-top: 10px;">সেভ করুন</button>
  </div>

  <script type="module" src="js/transaction.js?v=20"></script>
</body>
</html>

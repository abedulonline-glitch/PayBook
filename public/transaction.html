<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayBook - নতুন লেনদেন</title>
  <link rel="stylesheet" href="css/style.css?v=22">
  <style>
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: flex-end; }
    .modal-content { background: #fff; width: 100%; border-radius: 20px 20px 0 0; padding: 24px; text-align: center; }
    .modal-btn { width: 100%; padding: 16px; margin-bottom: 12px; border-radius: 12px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-camera { background: #E8F5E9; color: #2E7D32; }
    .btn-gallery { background: #E3F2FD; color: #1565C0; }
    .btn-cancel { background: #F0F0F0; color: #333; }
  </style>
</head>
<body style="display: block; background: var(--bg-color);">
  
  <div class="header">
    <button onclick="history.back()" style="background:none; border:none; color:var(--primary); font-size:24px; width: auto; padding: 0;">←</button>
    <h2 id="tx-party-name" style="flex-grow: 1; text-align: center; margin: 0;">লোড হচ্ছে...</h2>
    <div style="width: 24px;"></div>
  </div>

  <div style="padding: 20px; background: #fff; margin: 16px; border-radius: var(--border-radius); box-shadow: var(--shadow);">
    <div id="tx-type-header" style="text-align: center; margin-bottom: 20px; font-size: 20px; font-weight: 700;">প্রদেয় (Given)</div>

    <input type="number" id="visible-amount" placeholder="পাকা অ্যামাউন্ট (₹)" required style="font-size: 24px; text-align: center; font-weight: bold; padding: 20px;">
    
    <div style="margin-bottom: 12px;">
      <label style="display:block; margin-bottom:5px; font-size:14px; color:#666;">তারিখ (Date)</label>
      <input type="date" id="tx-date" style="width: 100%; padding: 12px; border: 1.5px solid #E0E0E0; border-radius: 12px; font-size: 16px; background: #FAFAFA;">
    </div>

    <input type="text" id="note" placeholder="নোট (ঐচ্ছিক)">
    
    <label style="display:block; margin-bottom:8px; font-weight:bold; color:var(--primary);">ইমেজ প্রুফ (বাধ্যতামূলক)</label>
    
    <button type="button" id="open-media-modal" style="background: #f0f0f0; color: #333; padding: 14px; border: 1px dashed #999; font-size: 15px; width: 100%; border-radius: 12px; margin-bottom: 12px;">
      📷 ছবি যোগ করুন
    </button>

    <!-- সিলেক্ট করা ছবিগুলোর প্রিভিউ -->
    <div id="image-preview-container" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;"></div>

    <!-- হিডেন ইনপুট (ক্যামেরা ও গ্যালারি আলাদা করা হলো) -->
    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
    <input type="file" id="gallery-input" accept="image/*" multiple style="display: none;">

    <button id="save-tx-btn" style="margin-top: 10px;">সেভ করুন</button>
  </div>

  <!-- মিডিয়া সিলেক্ট মোডাল -->
  <div class="modal-overlay" id="media-modal">
    <div class="modal-content">
      <h3 style="margin-bottom: 20px; color: #333;">ছবি যোগ করুন</h3>
      <button class="modal-btn btn-camera" id="btn-camera">📷 ক্যামেরা</button>
      <button class="modal-btn btn-gallery" id="btn-gallery">🖼️ গ্যালারি</button>
      <button class="modal-btn btn-cancel" id="btn-cancel">বাতিল করুন</button>
    </div>
  </div>

  <script type="module" src="js/transaction.js?v=22"></script>
</body>
</html>

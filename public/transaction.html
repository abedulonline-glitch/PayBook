<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayBook - নতুন লেনদেন</title>
  <link rel="stylesheet" href="css/style.css?v=4">
  <!-- Cropper.js CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
</head>
<body style="display: block; background: var(--bg-color);">
  
  <div class="header">
    <button onclick="history.back()" style="background:none; border:none; color:var(--primary); font-size:24px; width: auto; padding: 0;">←</button>
    <h2 id="tx-party-name" style="flex-grow: 1; text-align: center; margin: 0;">নতুন লেনদেন</h2>
    <div style="width: 24px;"></div>
  </div>

  <div style="padding: 20px; background: #fff; margin: 16px; border-radius: var(--border-radius); box-shadow: var(--shadow);">
    <div style="display: flex; gap: 16px; margin-bottom: 16px;">
      <label style="flex: 1; display: flex; align-items: center; gap: 8px; font-weight: bold; color: var(--danger);">
        <input type="radio" name="direction" value="given" checked style="width: 20px; height: 20px;"> প্রদেয় (Given)
      </label>
      <label style="flex: 1; display: flex; align-items: center; gap: 8px; font-weight: bold; color: var(--success);">
        <input type="radio" name="direction" value="received" style="width: 20px; height: 20px;"> প্রাপ্য (Received)
      </label>
    </div>

    <input type="number" id="visible-amount" placeholder="পাকা অ্যামাউন্ট (₹)" required>
    <input type="number" id="kacha-amount" placeholder="কাঁচা অ্যামাউন্ট (₹) - ঐচ্ছিক">
    <input type="text" id="note" placeholder="নোট (ঐচ্ছিক)">
    
    <label style="display:block; margin-bottom:8px; font-weight:bold;">ইমেজ প্রুফ (বাধ্যতামূলক)</label>
    <!-- capture="environment" সরিয়ে দেওয়া হয়েছে যাতে গ্যালারি ও ক্যামেরা দুটো অপশনই আসে -->
    <input type="file" id="image-input" accept="image/*" required>
    
    <!-- Cropper Image Preview -->
    <div id="cropper-container" style="display: none; margin-bottom: 12px; max-height: 300px;">
      <img id="image-preview" style="max-width: 100%;">
    </div>

    <button id="save-tx-btn" style="margin-top: 12px;">সেভ করুন</button>
  </div>

  <!-- Cropper.js Script -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
  <script type="module" src="js/transaction.js?v=4"></script>
</body>
</html>
